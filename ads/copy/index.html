<title>Nawa Ad Copy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
/* Layout: ad library. Each creative sits beside its three copy fields, grouped by service, with a sticky filter row. */
:root{--bg:#F6F5F2;--surface:#FFFFFF;--fg:#0B1220;--muted:#5A6170;--line:#E3E1DB;--accent:#5B4BFF;--lime:#C6F432;--on-lime:#0B1220;--warn-bg:#FFF4D6;--warn-fg:#6B4E00;
--ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;--lat:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#151D2E;--fg:#F3F4F7;--muted:#A9B0C0;--line:#273047;--accent:#8A7FFF;--warn-bg:#3A3112;--warn-fg:#F2D78A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#151D2E;--fg:#F3F4F7;--muted:#A9B0C0;--line:#273047;--accent:#8A7FFF;--warn-bg:#3A3112;--warn-fg:#F2D78A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ar);font-size:16px;line-height:1.7}
.wrap{max-width:1120px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-size:clamp(28px,4vw,40px);line-height:1.25;text-wrap:balance;margin:0}
header p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-inline-end:10px;vertical-align:middle}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap;padding-block:16px;margin-top:20px;border-bottom:1px solid var(--line)}
.filters button{font:500 15px var(--ar);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 16px;border-radius:99px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters button:focus-visible,.cp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section.svc{margin-top:44px}
section.svc>h2{font-size:24px;margin:0 0 4px}
section.svc>p{color:var(--muted);margin:0 0 20px}
.ad{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:18px}
.imgs{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;align-items:start}.imgs img{width:100%;border-radius:12px;display:block;max-width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.id{font:600 14px var(--lat);color:var(--muted);direction:ltr}
.fields{display:grid;gap:16px;margin-top:10px}
.f{min-width:0}
.f .lab{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.f .lab small{font:500 12px var(--lat);direction:ltr}
.f .txt{margin-top:6px;white-space:pre-line;overflow-wrap:anywhere}
.f.h .txt{font-size:20px;font-weight:700;line-height:1.5}
.cp{margin-inline-start:auto;font:500 13px var(--ar);background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 14px;font-size:14px}
.cta{font-size:13px;background:var(--lime);color:var(--on-lime);border-radius:99px;padding:3px 12px;font-weight:700}
@media (max-width:720px){.ad{grid-template-columns:1fr;padding:16px}.imgs{max-width:420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
<header><h1><span class="dot"></span>نصوص إعلانات نواة</h1>
<p>18 إعلانًا، 3 لكل خدمة، بمقاسين: 4:5 للمنشورات و9:16 للستوري والريلز. لكل إعلان العنوان والنص الأساسي والوصف، جاهزة للصق في مدير إعلانات ميتا مع هدف «الرسائل» وزر «إرسال رسالة».</p></header>
<nav class="filters" id="filters" aria-label="الخدمات"></nav>
<main id="list"></main>
</div>
<script>
const SVC=[
 ['web','المواقع والتطبيقات','نبني موقعك أو تطبيقك من الفكرة إلى الإطلاق.'],
 ['brand','الهوية البصرية','شعار وألوان ودليل هوية وحسابات جاهزة.'],
 ['social','تصاميم السوشيال ميديا','تقويم شهري وتصاميم ونشر مجدول.'],
 ['ads','الإعلانات الممولة','حملات ميتا وتيك توك ومتابعة أسبوعية.'],
 ['growth','النتائج والتطوير','تقارير شهرية وتوصيات وتحسين مستمر.'],
 ['pay','الدفع الإلكتروني','الدفع بالبطاقة الذهبية وCIB على موقعك أو متجرك.'],
];
const ADS={
'web-1':{"cta": "إرسال رسالة", "h": "موقعك يعمل عندك 24/7", "p": "زبونك يبحث عنك في الليل، في العطلة، وأنت نائم.\nموقع احترافي يعرّف بمشروعك ويستقبل طلباته في أي وقت، بالعربية والفرنسية والإنجليزية، وسريع على الهاتف.\n\nالموقع الذي في الصورة هو موقع نواة: صمّمناه وبنيناه بأنفسنا.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "موقع احترافي بثلاث لغات"},
'web-2':{"cta": "إرسال رسالة", "h": "عندك بيزنس وما عندكش موقع؟", "p": "واش يناسب مشروعك؟\n١. Landing page لحملتك الإعلانية\n٢. Site web تعريفي بثلاث لغات\n٣. متجر E-commerce مع الدفع بالذهبية وCIB\n\nقولنا على مشروعك، ونقترحو عليك الأنسب.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "Landing page · Site web · E-commerce"},
'web-3':{"cta": "إرسال رسالة", "h": "زبائنك يبحثون عنك. هل سيجدونك؟", "p": "قبل ما يشري، الزبون يبحث في Google.\nإذا ما لقاش موقعك، يلقى منافسك.\nنبنيلك موقع سريع على الهاتف، واضح، وبثلاث لغات، يخلي الزبون يثق ويطلب.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "موقعك في المقدمة"},
'brand-1':{"cta": "إرسال رسالة", "h": "علامة تُعرف من النظرة الأولى", "p": "الزبون يحكم على مشروعك في ثوانٍ.\nنصمّم لك شعارًا وألوانًا وخطوطًا تحكي قصتك، مع دليل هوية وقوالب جاهزة لكل منشور.\n\nهوية نواة التي تراها في الصورة من تصميمنا.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "شعار + ألوان + دليل هوية"},
'brand-2':{"cta": "إرسال رسالة", "h": "نفس المشروع. انطباع مختلف", "p": "لوغو من الإنترنت، ألوان تتبدّل في كل منشور، وحسابات بلا غلاف؟\nهوية واحدة ثابتة تخلي مشروعك يبان بالحجم اللي يستاهلو، والزبون يتفكّرك.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "قبل وبعد الهوية"},
'brand-3':{"cta": "إرسال رسالة", "h": "لوغو من الإنترنت؟ مشروعك يستاهل أحسن", "p": "باقة الهوية والحضور:\n✓ الشعار والألوان والخطوط\n✓ دليل الهوية وقوالب جاهزة\n✓ صور وأغلفة ونبذات كل حساباتك\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "باقة الهوية والحضور"},
'social-1':{"cta": "إرسال رسالة", "h": "واش ننشرو اليوم؟ خليها علينا", "p": "نخطّطو محتوى الشهر كامل، نصمّموه بهوية مشروعك، وننشروه في وقتو تلقائيًا.\nأنت توافق من هاتفك، والباقي علينا.\n\nالتصاميم في الصورة منشورات حقيقية من حساب نواة.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "محتوى شهري جاهز"},
'social-2':{"cta": "إرسال رسالة", "h": "شهر كامل من المحتوى، مجدول", "p": "تقويم محتوى شهري: منشورات، كاروسيل، وأغلفة ريلز.\nتشوف كل منشور قبل ما يتنشر، توافق أو تطلب تعديل، ويتنشر تلقائيًا في يومه وساعته.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "تقويم شهري + نشر تلقائي"},
'social-3':{"cta": "إرسال رسالة", "h": "تصميم واحد، بمقاس كل منصة", "p": "Instagram، Facebook، TikTok، LinkedIn: لكل منصة مقاسها وجمهورها.\nنصمّمو محتواك متّسق مع هويتك، نكيّفوه لكل منصة، وننشروه من مكان واحد.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "نشر على 4 منصات"},
'ads-1':{"cta": "إرسال رسالة", "h": "نوصل منتجك لمن يبحث عنه", "p": "حملات مستهدفة على Facebook وInstagram وTikTok.\nنختارو الجمهور، نجرّبو عدة نسخ، ونتابعو النتائج كل أسبوع باش نحطّو الميزانية وين تجيب نتيجة.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "إعلانات Meta وTikTok"},
'ads-2':{"cta": "إرسال رسالة", "h": "زر «Booster» يحرق ميزانيتك", "p": "«Booster la publication» يصرف الدراهم بالخف، بصح نادرًا ما يجيب زبائن.\nالحملة الحقيقية فيها:\n١. جمهور محدّد بدقة\n٢. عدة نسخ تتجرّب مع بعض\n٣. تقرير أسبوعي بتكلفة كل نتيجة\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "حملات مدروسة، ماشي Boost عشوائي"},
'ads-3':{"cta": "إرسال رسالة", "h": "ميزانيتك تُدفع للمنصة مباشرة", "p": "نحن نسيّرو حملاتك على Meta وTikTok، وأنت تبقى المالك.\nالميزانية تتخلّص من حسابك مباشرة للمنصة، والحسابات والبيانات تبقى ملكك. احنا نوجّهوها للإعلانات الأنجح.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "شفافية كاملة في الميزانية"},
'growth-1':{"cta": "إرسال رسالة", "h": "نقرأ الأرقام ونقولك واش تعني", "p": "الوصول، التفاعل، التحويلات… أرقام بزاف، وسؤال واحد يهمّك: واش ندير درك؟\nكل شهر تقرير بلغة بسيطة، و3 توصيات واضحة للشهر القادم.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "تقرير شهري بتوصيات"},
'growth-2':{"cta": "إرسال رسالة", "h": "كل شهر أحسن من اللي قبلو", "p": "نتعلّمو من النتائج، نعدّلو المحتوى والإعلانات والمنتج، ونطلقو من جديد.\nدورة مستمرة: كل شهر يبني على اللي نجح في الشهر اللي قبلو.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "نتعلّم، نعدّل، نطلق"},
'growth-3':{"cta": "إرسال رسالة", "h": "شحال كلّفك كل زبون؟", "p": "إذا ما تعرفش تكلفة الزبون الواحد، ما تعرفش إذا إعلاناتك رابحة.\nلوحة متابعة للوصول والتفاعل والتحويلات، وتكلفة كل نتيجة في كل حملة، مع توصيات كل شهر.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "لوحة متابعة + تقرير شهري"},
'pay-1':{"cta": "إرسال رسالة", "h": "متجرك يقبل الدفع بالذهبية وCIB", "p": "زبونك حاب يشري درك، ماشي يستنى التوصيل باش يخلّص.\nنضيفو لموقعك أو متجرك الدفع الإلكتروني بالبطاقة الذهبية وCIB، يخلّص من هاتفه في دقيقة.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "Paiement en ligne لمتجرك"},
'pay-2':{"cta": "إرسال رسالة", "h": "الزبون يخلّص قبل ما يوصلو الطلب", "p": "الدفع عند الاستلام برك = طلبات تترفض عند الباب ومصاريف توصيل ضايعة.\n✓ دفع آمن بالذهبية وCIB\n✓ مرتجعات وطلبات ملغاة أقل\n✓ نتكفّلو بالربط والتجربة\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "الذهبية وCIB على موقعك"},
'pay-3':{"cta": "إرسال رسالة", "h": "من «حاب نطلب» إلى «تم الدفع»", "p": "موقع أو متجر جاهز للبيع، والدفع فيه بالبطاقة اللي عند زبونك: الذهبية ولا CIB.\nكلش في صفحة وحدة، من اختيار المنتج حتى تأكيد الدفع.\n\nالاستشارة الأولى مجانية (30 دقيقة). راسلنا الآن 👇", "d": "موقع + دفع إلكتروني"},
};
const LAB={h:['العنوان','Headline'],p:['النص الأساسي','Primary text'],d:['الوصف','Description']};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML=SVC.map(([k,name,sub])=>`<section class="svc" data-svc="${k}"><h2>${name}</h2><p>${sub}</p>${[1,2,3].map(n=>{const id=`${k}-${n}`,a=ADS[id];return `<article class="ad"><div class="imgs"><img src="img/feed/${id}.jpg" alt="${esc(a.h)}, 4:5" loading="lazy" width="1080" height="1350"><img src="img/story/${id}.jpg" alt="${esc(a.h)}, 9:16" loading="lazy" width="1080" height="1920"></div><div style="min-width:0"><div class="meta"><span class="id">${id}.png</span><span class="cta">الزر: ${a.cta}</span></div><div class="fields">${['h','p','d'].map(f=>`<div class="f ${f}"><div class="lab">${LAB[f][0]} <small>${LAB[f][1]}</small><button class="cp" type="button" data-t="${esc(a[f])}">نسخ</button></div><div class="txt">${esc(a[f])}</div></div>`).join('')}</div></div></article>`}).join('')}</section>`).join('');
const fl=document.getElementById('filters');
fl.innerHTML=[['all','الكل'],...SVC.map(s=>[s[0],s[1]])].map(([k,n],i)=>`<button type="button" data-k="${k}" aria-pressed="${i==0}">${n}</button>`).join('');
fl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('section.svc').forEach(s=>s.hidden=!(b.dataset.k=='all'||s.dataset.svc==b.dataset.k));});
document.addEventListener('click',e=>{const b=e.target.closest('.cp');if(!b)return;const done=()=>{b.textContent='نُسخ';setTimeout(()=>b.textContent='نسخ',1500)};
const sel=()=>{const r=document.createRange();r.selectNodeContents(b.closest('.f').querySelector('.txt'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='حدّد ثم انسخ'};
try{navigator.clipboard.writeText(b.dataset.t).then(done,sel)}catch(_){sel()}});
document.documentElement.dir='rtl';document.documentElement.lang='ar';
</script>
