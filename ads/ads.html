<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
:root{--ink:#0B1220;--ink2:#151D2E;--indigo:#5B4BFF;--indigo2:#8A7FFF;--lime:#C6F432;--paper:#F6F5F2;--muted:#5A6170;--line:#E3E1DB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"IBM Plex Sans Arabic",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:center}
.ad{width:1080px;height:1350px;position:relative;overflow:hidden;padding:84px 84px 0;display:flex;flex-direction:column}
.ink{background:var(--ink);color:#fff}.paper{background:var(--paper);color:var(--ink)}.indigo{background:var(--indigo);color:#fff}.lime-bg{background:var(--lime);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px}
.brand svg{width:64px;height:64px}
.indigo .brand svg rect{fill:var(--ink)}
.bars{direction:ltr}
.tag{font-size:26px;font-weight:500;padding:12px 26px;border-radius:99px;border:2px solid currentColor;opacity:.9}
.k{font-size:30px;font-weight:500;margin-top:64px;display:flex;align-items:center;gap:14px}
.k:before{content:"";width:16px;height:16px;border-radius:50%;background:var(--lime)}
.lime-bg .k:before,.paper .k:before{background:var(--indigo)}
h1{font-size:92px;line-height:1.18;font-weight:700;margin-top:22px;letter-spacing:-.5px}
h1 .hl{color:var(--lime)}.paper h1 .hl,.lime-bg h1 .hl{color:var(--indigo)}
h1 .mark{background:var(--lime);color:var(--ink);padding:0 14px;border-radius:14px}
.sub{font-size:36px;line-height:1.6;margin-top:26px;opacity:.82;max-width:880px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:40px 0 64px}
.cta{background:var(--lime);color:var(--ink);font-weight:700;font-size:36px;padding:24px 46px;border-radius:99px;display:flex;align-items:center;gap:16px}
.paper .cta,.lime-bg .cta{background:var(--ink);color:#fff}
.url{font-family:"Bricolage Grotesque";font-size:28px;opacity:.75;direction:ltr}
.vis{flex:1;position:relative;margin-top:48px;min-height:0}
/* browser */
.browser{background:#fff;border-radius:28px;box-shadow:0 40px 80px rgba(0,0,0,.35);overflow:hidden;color:var(--ink)}
.bar{height:58px;background:#EEECE7;display:flex;align-items:center;gap:12px;padding:0 24px;direction:ltr}
.bar i{width:16px;height:16px;border-radius:50%;background:#D5D2CA}
.bar b{flex:1;margin-left:20px;height:32px;border-radius:10px;background:#fff;font:500 20px "Bricolage Grotesque";color:var(--muted);display:flex;align-items:center;padding:0 16px}
.page{padding:36px 40px}
.nav{display:flex;justify-content:space-between;align-items:center}
.lg{width:120px;height:22px;border-radius:8px;background:var(--ink)}
.links{display:flex;gap:16px}.links span{width:70px;height:14px;border-radius:7px;background:var(--line)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;margin-top:40px;align-items:center}
.ln{height:26px;border-radius:9px;background:var(--ink);margin-bottom:14px}
.ln.s{height:14px;background:var(--line)}
.btn{width:180px;height:50px;border-radius:99px;background:var(--indigo);margin-top:20px}
.img{aspect-ratio:1.1;border-radius:22px;background:linear-gradient(135deg,var(--indigo),var(--indigo2));position:relative}
.img:after{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50%;background:var(--lime);left:12%;bottom:14%}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.cards div{height:120px;border-radius:18px;background:var(--paper);border:2px solid var(--line)}
.phone{position:absolute;width:250px;height:500px;border-radius:44px;background:var(--ink);border:10px solid #222B3D;box-shadow:0 30px 60px rgba(0,0,0,.4);padding:28px 18px;overflow:hidden}
.phone .ln{background:#fff}.phone .ln.s{background:#2C354A}
.chip{position:absolute;background:#fff;color:var(--ink);border-radius:22px;padding:20px 26px;font-size:28px;font-weight:700;box-shadow:0 20px 40px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px}
.chip small{display:block;font-size:20px;font-weight:500;color:var(--muted)}
.dot{width:46px;height:46px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:26px;color:var(--ink)}
.list{list-style:none;margin-top:44px;display:grid;gap:22px}
.list li{font-size:38px;font-weight:500;display:flex;align-items:center;gap:22px;background:#fff;border-radius:24px;padding:26px 30px;border:2px solid var(--line)}
.ink .list li,.indigo .list li{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
.list li .n{width:58px;height:58px;flex:none;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:800 28px "Bricolage Grotesque"}
.big{font:800 300px/0.9 "Bricolage Grotesque";letter-spacing:-8px}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tile{aspect-ratio:1;border-radius:26px;position:relative;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:40px;text-align:center;padding:20px;line-height:1.3}
.sw{display:flex;gap:18px;margin-top:20px}.sw span{flex:1;height:140px;border-radius:22px;display:flex;align-items:flex-end;padding:16px;font:600 22px "Bricolage Grotesque";direction:ltr}
.bars{display:flex;align-items:flex-end;gap:26px;height:100%}
.bars div{flex:1;border-radius:18px 18px 6px 6px;background:rgba(255,255,255,.15)}
.bars div.on{background:var(--lime)}
.stat{font:800 120px/1 "Bricolage Grotesque";direction:ltr;display:inline-block}
.card{background:#fff;color:var(--ink);border-radius:30px;padding:34px;box-shadow:0 30px 60px rgba(0,0,0,.2)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:26px;height:100%}
.vs>div{border-radius:30px;padding:40px;display:flex;flex-direction:column;gap:22px;font-size:34px;font-weight:500}
.vs h3{font-size:42px}
</style></head><body>
<script>
const LOGO=`<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>`;
const hd=(tag)=>`<div class="top"><div class="brand">${LOGO}نواة</div><span class="tag">${tag}</span></div>`;
const foot=(cta='ابدأ مشروعك')=>`<div class="foot"><div class="cta">${cta} ←</div><div class="url">nawa-studio-six.vercel.app</div></div>`;
const browser=(url,extra='')=>`<div class="browser"${extra}><div class="bar"><i></i><i></i><i></i><b>${url}</b></div><div class="page"><div class="nav"><div class="lg"></div><div class="links"><span></span><span></span><span></span></div></div><div class="hero"><div><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln s"></div><div class="ln s" style="width:80%"></div><div class="btn"></div></div><div class="img"></div></div><div class="cards"><div></div><div></div><div></div></div></div></div>`;
const phone=(style)=>`<div class="phone" style="${style}"><div class="img" style="aspect-ratio:1;border-radius:18px"></div><div class="ln" style="margin-top:22px;width:80%;height:18px"></div><div class="ln s" style="height:10px"></div><div class="ln s" style="height:10px;width:60%"></div><div class="btn" style="width:100%;height:40px;background:var(--lime)"></div></div>`;
const ads=[
/* ===== 1. WEBSITES ===== */
['web-1','ink',`${hd('مواقع وتطبيقات')}<div class="k">نطوّر لك المنتج</div><h1>موقعك هو <span class="hl">أول موظف</span><br>يعمل عندك 24/7.</h1><p class="sub">نصمّمه ونبنيه ونطلقه، بلغتين أو ثلاث، وسريعًا على الهاتف.</p>
<div class="vis" style="overflow:hidden;margin-inline:-84px;padding-inline:84px">${browser('yourbrand.dz','style="position:absolute;inset:10px 0 auto 120px;transform:scale(.8);transform-origin:top right"')}${phone('left:0;top:110px;height:440px')}<div class="chip" style="right:-10px;bottom:40px"><span class="dot">✓</span><div>يعمل على كل الأجهزة<small>هاتف، لوحي، حاسوب</small></div></div></div>${foot()}`],
['web-2','paper',`${hd('مواقع وتطبيقات')}<div class="k">من الفكرة إلى الإطلاق</div><h1>عندك فكرة؟<br>عندنا <span class="hl">الفريق</span> الذي يبنيها.</h1>
<ul class="list"><li><span class="n">1</span>ورشة نفهم فيها مشروعك وجمهورك</li><li><span class="n">2</span>تصميم تفاعلي تجرّبه قبل البرمجة</li><li><span class="n">3</span>تطوير على دفعات، وتجرّب كل دفعة</li><li><span class="n">4</span>إطلاق ومتابعة، والكود ملكك بالكامل</li></ul>${foot('احجز جلسة تعارف')}`],
['web-3','indigo',`${hd('مواقع وتطبيقات')}<div class="k">موقع احترافي لعلامتك</div><h1>زبائنك يبحثون عنك.<br><span class="mark">هل سيجدونك؟</span></h1><p class="sub">صفحة هبوط، موقع تعريفي، أو متجر: نبني ما يناسب مشروعك.</p>
<div class="vis"><div class="ring" style="width:900px;height:900px;left:-300px;top:-80px"></div><div class="ring" style="width:600px;height:600px;left:-150px;top:70px"></div>
<div class="grid4" style="position:absolute;inset:20px 0 auto 0;grid-template-columns:repeat(3,1fr)">
<div class="tile" style="background:#fff;color:var(--ink)">صفحة<br>هبوط</div><div class="tile" style="background:var(--lime);color:var(--ink)">موقع<br>تعريفي</div><div class="tile" style="background:var(--ink)">متجر<br>إلكتروني</div></div>
<div class="chip" style="right:0;bottom:30px"><span class="dot">ع</span><div>عربي · Français · English<small>موقع بثلاث لغات</small></div></div></div>${foot()}`],
/* ===== 2. IDENTITY ===== */
['brand-1','lime-bg',`${hd('الهوية البصرية')}<div class="k">نصنع لك هوية وحضورًا</div><h1>علامة تُعرف<br>من <span class="hl">النظرة الأولى.</span></h1><p class="sub" style="opacity:.9">شعار، ألوان، خطوط، ودليل هوية جاهز للاستخدام.</p>
<div class="vis"><div class="card" style="position:absolute;inset:0 0 40px 0;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center"><div style="display:grid;place-items:center">${LOGO.replace('<svg','<svg style="width:300px;height:300px"')}</div><div><div style="font:800 64px 'Bricolage Grotesque'">Aa أب</div><div class="sw"><span style="background:#5B4BFF;color:#fff">#5B4BFF</span><span style="background:#0B1220;color:#fff">#0B1220</span></div><div class="sw"><span style="background:#C6F432">#C6F432</span><span style="background:#F6F5F2;border:2px solid var(--line)">#F6F5F2</span></div></div></div></div>${foot()}`],
['brand-2','ink',`${hd('الهوية البصرية')}<div class="k">قبل وبعد</div><h1>نفس المشروع.<br><span class="hl">انطباع مختلف تمامًا.</span></h1>
<div class="vis"><div class="vs"><div style="background:#2A3142;color:#A9B0C0"><h3>بدون هوية</h3><div>شعار من الإنترنت</div><div>ألوان مختلفة في كل منشور</div><div>حسابات بلا أغلفة ولا نبذة</div><div style="margin-top:auto;font-size:80px">😕</div></div><div style="background:var(--lime);color:var(--ink)"><h3>مع نواة</h3><div>شعار يحكي قصتك</div><div>ألوان وخطوط ثابتة</div><div>حسابات جاهزة على كل منصة</div><div style="margin-top:auto">${LOGO.replace('<svg','<svg style="width:110px;height:110px"')}</div></div></div></div>${foot()}`],
['brand-3','paper',`${hd('الهوية البصرية')}<div class="k">ماذا تحصل عليه</div><h1>هوية كاملة،<br><span class="hl">وحضور جاهز</span> على كل منصة.</h1>
<ul class="list"><li><span class="n">✓</span>الشعار والألوان والخطوط</li><li><span class="n">✓</span>دليل الهوية وقوالب جاهزة</li><li><span class="n">✓</span>صور وأغلفة ونبذات الحسابات</li><li><span class="n">✓</span>صفحة هبوط بلغتين أو ثلاث</li></ul>${foot()}`],
/* ===== 3. SOCIAL ===== */
['social-1','indigo',`${hd('تصاميم السوشيال ميديا')}<div class="k">محتوى كل أسبوع</div><h1>توقّف عن السؤال:<br><span class="mark">ماذا ننشر اليوم؟</span></h1><p class="sub">نخطّط محتوى الشهر ونصمّمه وننشره في مواعيده تلقائيًا.</p>
<div class="vis"><div class="grid4" style="position:absolute;inset:0 60px auto 60px">
<div class="tile" style="background:var(--lime);color:var(--ink)">عرض<br>الأسبوع</div><div class="tile" style="background:var(--ink)">٣ نصائح<br>لـ…</div><div class="tile" style="background:#fff;color:var(--indigo)">▶ ريلز</div>
<div class="tile" style="background:#fff;color:var(--ink)">آراء<br>العملاء</div><div class="tile" style="background:var(--lime);color:var(--ink)">جديدنا</div><div class="tile" style="background:var(--ink)">كاروسيل<br>١/٥</div></div></div>${foot()}`],
['social-2','paper',`${hd('تصاميم السوشيال ميديا')}<div class="k">تقويم محتوى شهري</div><h1>شهر كامل من المحتوى،<br><span class="hl">جاهز ومجدول.</span></h1>
<div class="vis"><div class="card" style="position:absolute;inset:0 0 30px 0;padding:30px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;font-size:22px;color:var(--muted);text-align:center;font-weight:500">${['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'].map(d=>`<div>${d}</div>`).join('')}${Array.from({length:28},(_,i)=>{const c=[2,4,7,9,11,14,16,18,21,23,25].includes(i)?(i%3?'var(--indigo)':'var(--lime)'):'';return `<div style="aspect-ratio:1.15;border-radius:14px;border:2px solid var(--line);position:relative;font:600 20px 'Bricolage Grotesque';padding:8px;text-align:start;direction:ltr">${i+1}${c?`<span style="position:absolute;inset:auto 8px 8px 8px;height:30%;border-radius:8px;background:${c}"></span>`:''}</div>`}).join('')}</div></div></div>${foot()}`],
['social-3','ink',`${hd('تصاميم السوشيال ميديا')}<div class="k">على كل المنصات</div><h1>تصميم واحد متّسق،<br><span class="hl">بمقاس كل منصة.</span></h1>
<div class="vis">${phone('left:40px;top:40px;transform:rotate(-6deg)')}${phone('left:380px;top:0;height:560px;background:var(--indigo)')}${phone('right:40px;top:40px;transform:rotate(6deg)')}
<div class="chip" style="right:300px;bottom:30px">Instagram · Facebook · TikTok · LinkedIn</div></div>${foot()}`],
/* ===== 4. ADS ===== */
['ads-1','ink',`${hd('الإعلانات الممولة')}<div class="k">ميتا وتيك توك</div><h1>نوصل منتجك<br>إلى <span class="hl">من يبحث عنه.</span></h1><p class="sub">حملات مستهدفة على ميتا وتيك توك، نتابعها كل أسبوع.</p>
<div class="vis"><div class="card" style="position:absolute;inset:10px 0 40px 0;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;font-size:30px;font-weight:700">أداء الحملة<span style="color:var(--muted);font-weight:500">آخر 7 أيام</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px">${[['الوصول','48K'],['النقرات','3.1K'],['الرسائل','214']].map(([a,b])=>`<div style="background:var(--paper);border-radius:20px;padding:20px"><div style="font-size:24px;color:var(--muted)">${a}</div><div style="font:800 56px 'Bricolage Grotesque';direction:ltr;text-align:end">${b}</div></div>`).join('')}</div><div class="bars" style="margin-top:26px;flex:1">${[30,42,38,55,61,74,92].map((h,i)=>`<div class="${i==6?'on':''}" style="height:${h}%;background:${i==6?'var(--lime)':'#E8E6FF'}"></div>`).join('')}</div></div></div>${foot()}`],
['ads-2','lime-bg',`${hd('الإعلانات الممولة')}<div class="k">ميزانيتك تستحق خطة</div><h1>لا تحرق ميزانيتك<br>بزر <span class="hl">«ترويج المنشور».</span></h1>
<ul class="list"><li><span class="n">1</span>جمهور محدّد بدقة</li><li><span class="n">2</span>عدة نسخ إبداعية تُختبر معًا</li><li><span class="n">3</span>البكسل وتتبّع التحويلات</li><li><span class="n">4</span>تقرير أسبوعي بتكلفة كل نتيجة</li></ul>${foot()}`],
['ads-3','indigo',`${hd('الإعلانات الممولة')}<div class="k">حساباتك تبقى ملكك</div><h1>ميزانيتك تُدفع<br>للمنصة <span class="mark">مباشرة.</span></h1><p class="sub">نحن ندير الحملات، وأنت تملك الحساب والبيانات دائمًا.</p>
<div class="vis"><div class="ring" style="width:800px;height:800px;right:-200px;top:-60px"></div>
<div class="chip" style="right:40px;top:40px;font-size:34px"><span class="dot">f</span><div>Meta Ads<small>فيسبوك وإنستغرام</small></div></div>
<div class="chip" style="left:40px;top:220px;font-size:34px"><span class="dot">♪</span><div>TikTok Ads<small>و Spark Ads</small></div></div>
<div class="chip" style="right:140px;top:400px;font-size:34px"><span class="dot">↗</span><div>تكلفة أقل لكل نتيجة<small>نوجّه الميزانية إلى الأنجح</small></div></div></div>${foot()}`],
/* ===== 5. RESULTS & GROWTH ===== */
['growth-1','ink',`${hd('النتائج والتطوير')}<div class="k">ندرس النتائج</div><h1>نقرأ الأرقام،<br><span class="hl">ونخبرك بما تعنيه.</span></h1>
<div class="vis"><div class="bars" style="position:absolute;inset:40px 0 200px 0">${[28,35,33,46,52,60,71,86].map((h,i)=>`<div class="${i>5?'on':''}" style="height:${h}%"></div>`).join('')}</div>
<div class="chip" style="left:0;bottom:50px"><span class="dot">↗</span><div><span style="font:800 44px 'Bricolage Grotesque';direction:ltr;display:inline-block">+38%</span> تفاعل<small>تقرير شهري بتوصيات واضحة</small></div></div></div>${foot()}`],
['growth-2','paper',`${hd('النتائج والتطوير')}<div class="k">دورة لا تتوقف</div><h1>كل شهر،<br><span class="hl">أفضل من الذي قبله.</span></h1>
<div class="vis" style="display:grid;place-items:center"><div style="position:relative;width:640px;height:640px">
<div style="position:absolute;inset:0;border-radius:50%;border:6px dashed var(--indigo);opacity:.4"></div>
${[['نتعلّم','top:-10px;left:50%;transform:translateX(-50%)'],['نعدّل','bottom:60px;right:-30px'],['نطلق','bottom:60px;left:-30px']].map(([t,s])=>`<div class="tile" style="position:absolute;${s};width:240px;height:240px;background:var(--ink);color:#fff;font-size:52px;border-radius:50%">${t}</div>`).join('')}
