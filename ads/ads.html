<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
:root{--ink:#0B1220;--ink2:#151D2E;--indigo:#5B4BFF;--indigo2:#8A7FFF;--lime:#C6F432;--paper:#F6F5F2;--muted:#5A6170;--line:#E3E1DB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"IBM Plex Sans Arabic",sans-serif;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:flex-start}
.ad{width:1080px;height:1350px;position:relative;overflow:hidden;padding:80px 84px 0;display:flex;flex-direction:column}
.ad.story{height:1920px;padding-top:240px}
.ink{background:var(--ink);color:#fff}.paper{background:var(--paper);color:var(--ink)}.indigo{background:var(--indigo);color:#fff}.lime-bg{background:var(--lime);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:40px}
.brand svg{width:64px;height:64px}.indigo .brand svg rect{fill:var(--ink)}
.tag{font-size:26px;font-weight:500;padding:12px 26px;border-radius:99px;border:2px solid currentColor;opacity:.9}
.k{font-size:30px;font-weight:500;margin-top:56px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k:before{content:"";width:16px;height:16px;border-radius:50%;background:var(--lime)}
.lime-bg .k:before,.paper .k:before{background:var(--indigo)}
.price{margin-inline-start:auto;background:var(--lime);color:var(--ink);border-radius:99px;padding:6px 20px;font-weight:700;font-size:28px}
.lime-bg .price{background:var(--ink);color:#fff}
h1{font-size:96px;line-height:1.18;font-weight:700;margin-top:20px;letter-spacing:-.5px;text-wrap:balance}
.story h1{font-size:96px}
h1 .hl{color:var(--lime)}.paper h1 .hl,.lime-bg h1 .hl{color:var(--indigo)}
h1 .mark{background:var(--lime);color:var(--ink);padding:0 14px;border-radius:14px}
.sub{font-size:36px;line-height:1.55;margin-top:22px;opacity:.85}
.vis{flex:1;position:relative;margin-top:44px;min-height:0;display:flex;align-items:center}
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
.story .stage{height:720px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:30px;padding:36px 0 60px}
.story .foot{padding-bottom:330px}
.cta{background:var(--lime);color:var(--ink);font-weight:700;font-size:38px;padding:24px 44px;border-radius:99px;display:flex;align-items:center;gap:16px;white-space:nowrap}
.cta svg{width:42px;height:42px}
.paper .cta,.lime-bg .cta{background:var(--ink);color:#fff}
.offer{text-align:start;line-height:1.35}
.offer b{display:block;font-size:32px}
.offer span{font-size:24px;opacity:.75}.offer span bdi{font-family:"Bricolage Grotesque"}
.proof{position:absolute;z-index:3;background:var(--lime);color:var(--ink);font-size:26px;font-weight:700;padding:12px 22px;border-radius:99px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.lime-bg .proof{background:var(--ink);color:#fff}
.ex{position:absolute;z-index:3;background:#fff;color:var(--muted);border:2px dashed #B9B6AE;font-size:22px;font-weight:700;padding:6px 16px;border-radius:99px}
/* frames */
.browser{position:absolute;background:#fff;border-radius:24px;box-shadow:0 40px 80px rgba(0,0,0,.4);overflow:hidden}
.bar{height:46px;background:#EEECE7;display:flex;align-items:center;gap:10px;padding:0 20px;direction:ltr}
.bar i{width:13px;height:13px;border-radius:50%;background:#D5D2CA}
.bar b{flex:1;margin-left:16px;height:26px;border-radius:8px;background:#fff;font:500 17px "Bricolage Grotesque";color:var(--muted);display:flex;align-items:center;padding:0 12px}
.browser img{display:block;width:100%}
.phone{position:absolute;width:250px;border-radius:40px;background:#111;border:10px solid #222B3D;box-shadow:0 30px 60px rgba(0,0,0,.45);overflow:hidden}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.chip{position:absolute;background:#fff;color:var(--ink);border-radius:22px;padding:18px 24px;font-size:28px;font-weight:700;box-shadow:0 20px 40px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px}
.chip small{display:block;font-size:20px;font-weight:500;color:var(--muted)}
.dot{width:46px;height:46px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:26px;color:var(--ink);flex:none}
.list{list-style:none;display:grid;gap:22px;width:100%}
.story .list{gap:30px}
.list li{font-size:38px;font-weight:500;display:flex;align-items:center;gap:22px;background:#fff;border-radius:24px;padding:26px 30px;border:2px solid var(--line)}
.story .list li{font-size:44px;padding:36px}
.ink .list li,.indigo .list li{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
.list li .n{width:58px;height:58px;flex:none;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:800 28px "Bricolage Grotesque"}
.list li em{font-style:normal;font-family:"Bricolage Grotesque";font-weight:700}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.tile{border-radius:26px;display:grid;place-items:center;font-weight:700;font-size:40px;text-align:center;padding:20px;line-height:1.3}
.sw{display:flex;gap:16px;margin-top:18px}.sw span{flex:1;height:130px;border-radius:20px;display:flex;align-items:flex-end;padding:14px;font:600 20px "Bricolage Grotesque";direction:ltr}
.bars{display:flex;align-items:flex-end;gap:26px;direction:ltr}
.bars div{flex:1;border-radius:18px 18px 6px 6px;background:rgba(255,255,255,.15)}
.card{background:#fff;color:var(--ink);border-radius:30px;padding:32px;box-shadow:0 30px 60px rgba(0,0,0,.2)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:26px;height:100%}
.vs>div{border-radius:30px;padding:40px;display:flex;flex-direction:column;gap:22px;font-size:34px;font-weight:500}
.vs h3{font-size:42px}
.bcard{position:absolute;width:420px;height:265px;border-radius:26px;padding:30px;color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;font-family:"Bricolage Grotesque";direction:ltr}
.bcard .chipx{width:64px;height:48px;border-radius:10px;background:linear-gradient(135deg,#f3e3a1,#c9a640)}
.bcard .num{font-size:30px;letter-spacing:4px;font-weight:600}
.bcard .nm{display:flex;justify-content:space-between;align-items:flex-end;font-size:30px;font-weight:800}
.gold{background:linear-gradient(135deg,#F2C94C,#B8860B);color:#2b1d00}
.cib{background:linear-gradient(135deg,#1F6F54,#0B3B2C)}
.field{height:62px;border-radius:16px;border:2px solid var(--line);margin-top:14px;display:flex;align-items:center;padding:0 20px;font:600 24px "Bricolage Grotesque";color:var(--muted);direction:ltr}
.opt{flex:1;border-radius:18px;border:3px solid var(--line);padding:18px;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px}
.opt.on{border-color:var(--indigo);background:#EEECFF}
.opt i{width:54px;height:36px;border-radius:8px;flex:none}
.search{position:absolute;background:#fff;color:var(--ink);border-radius:99px;padding:22px 34px;font-size:32px;font-weight:500;display:flex;gap:18px;align-items:center;box-shadow:0 24px 50px rgba(0,0,0,.3)}
.boost{background:#1877F2;color:#fff;border-radius:16px;padding:22px 40px;font:700 38px "Bricolage Grotesque";position:relative;display:inline-block}
.boost:after{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:8px;background:#E5484D;border-radius:4px;transform:rotate(-10deg)}
</style></head><body>
<script>
/* Fill a starting price per service to show a «ابتداءً من» badge, e.g. web:'25 000 دج'. Leave '' to hide it. */
const PRICE={web:'',brand:'',social:'',ads:'',growth:'',pay:''};
const LOGO=`<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>`;
const MSG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg>`;
const hd=t=>`<div class="top"><div class="brand">${LOGO}نواة</div><span class="tag">${t}</span></div>`;
const kk=(svc,t)=>`<div class="k">${t}${PRICE[svc]?`<span class="price">ابتداءً من ${PRICE[svc]}</span>`:''}</div>`;
const foot=(cta='راسلنا الآن')=>`<div class="foot"><div class="cta">${MSG}${cta}</div><div class="offer"><b>الاستشارة الأولى مجانية</b><span>30 دقيقة · <bdi>@nawa.studio.ai</bdi></span></div></div>`;
const V=s=>`<div class="vis"><div class="stage">${s}</div></div>`;
const proof=(t,s)=>`<div class="proof" style="${s}">✓ ${t}</div>`;
const ex=s=>`<div class="ex" style="${s}">مثال توضيحي</div>`;
const shot=(s)=>`<div class="browser" style="${s}"><div class="bar"><i></i><i></i><i></i><b>nawa-studio</b></div><img src="assets/site-desktop.png"></div>`;
const ph=(img,s)=>`<div class="phone" style="${s}"><img src="assets/${img}"></div>`;
const bc=(cls,name,style)=>`<div class="bcard ${cls}" style="${style}"><div style="display:flex;justify-content:space-between"><span class="chipx"></span><span style="font-size:24px;opacity:.85">)))</span></div><div class="num">•••• •••• •••• 2026</div><div class="nm"><span style="font-size:22px;font-weight:600;opacity:.85">CARD HOLDER</span>${name}</div></div>`;
const ads=[
/* ===== WEBSITES ===== */
['web-1','ink','web',`${hd('مواقع · Site web')}${kk('web','نطوّر لك موقعك')}<h1>موقعك هو <span class="hl">أول موظف</span><br>يعمل عندك 24/7.</h1>
${V(`${shot('right:0;top:20px;width:780px')}${ph('site-mobile.png','left:0;top:110px;height:470px;width:230px')}${proof('موقع نواة: صمّمناه وبنيناه بأنفسنا','right:30px;bottom:0')}`)}${foot()}`],
['web-2','paper','web',`${hd('مواقع · Site web')}${kk('web','واش يناسب مشروعك؟')}<h1>عندك بيزنس<br>و<span class="hl">ما عندكش موقع؟</span></h1>
${V(`<ul class="list"><li><span class="n">1</span><span><em>Landing page</em> لحملتك الإعلانية</span></li><li><span class="n">2</span><span><em>Site web</em> تعريفي بثلاث لغات</span></li><li><span class="n">3</span><span>متجر <em>E-commerce</em> مع الدفع بالبطاقة</span></li></ul>`)}${foot()}`],
['web-3','indigo','web',`${hd('مواقع · Site web')}${kk('web','زبونك يبحث في Google')}<h1>زبائنك يبحثون عنك.<br><span class="mark">هل سيجدونك؟</span></h1>
${V(`<div class="ring" style="width:900px;height:900px;left:-300px;top:-120px"></div><div class="search" style="right:0;top:30px;width:620px"><span style="font-size:36px">⌕</span>أفضل محل قريب مني…</div>${ph('site-mobile.png','left:30px;top:0;height:560px;width:270px')}<div class="chip" style="right:40px;top:200px"><span class="dot">١</span><div>موقعك في المقدمة<small>سريع على الهاتف وبثلاث لغات</small></div></div>${proof('من إنجازاتنا','right:40px;top:360px')}`)}${foot()}`],
/* ===== BRAND ===== */
['brand-1','lime-bg','brand',`${hd('الهوية البصرية')}${kk('brand','شعار · ألوان · دليل هوية')}<h1>علامة تُعرف<br>من <span class="hl">النظرة الأولى.</span></h1>
${V(`<div class="card" style="position:absolute;inset:20px 0 30px 0;display:grid;grid-template-columns:1fr 1.1fr;gap:30px;align-items:center"><div style="display:grid;place-items:center">${LOGO.replace('<svg','<svg style="width:270px;height:270px"')}</div><div><div style="font:800 60px 'Bricolage Grotesque'">Aa أب</div><div class="sw"><span style="background:#5B4BFF;color:#fff">#5B4BFF</span><span style="background:#0B1220;color:#fff">#0B1220</span></div><div class="sw"><span style="background:#C6F432">#C6F432</span><span style="background:#F6F5F2;border:2px solid var(--line)">#F6F5F2</span></div></div></div>${proof('هوية نواة: من تصميمنا','left:30px;top:0')}`)}${foot()}`],
['brand-2','ink','brand',`${hd('الهوية البصرية')}${kk('brand','قبل وبعد')}<h1>نفس المشروع.<br><span class="hl">انطباع مختلف تمامًا.</span></h1>
${V(`<div class="vs"><div style="background:#2A3142;color:#A9B0C0"><h3>بدون هوية</h3><div>لوغو من الإنترنت</div><div>ألوان تتبدّل في كل منشور</div><div>حسابات بلا غلاف</div></div><div style="background:var(--lime);color:var(--ink)"><h3>مع نواة</h3><div>شعار يحكي قصتك</div><div>ألوان وخطوط ثابتة</div><div>حسابات جاهزة</div><div style="margin-top:auto">${LOGO.replace('<svg','<svg style="width:100px;height:100px"')}</div></div></div>`)}${foot()}`],
['brand-3','paper','brand',`${hd('الهوية البصرية')}${kk('brand','باقة الهوية والحضور')}<h1>لوغو من الإنترنت؟<br><span class="hl">مشروعك يستاهل أحسن.</span></h1>
${V(`<ul class="list"><li><span class="n">✓</span>الشعار والألوان والخطوط</li><li><span class="n">✓</span>دليل الهوية وقوالب جاهزة</li><li><span class="n">✓</span>صور وأغلفة كل الحسابات</li></ul>`)}${foot()}`],
/* ===== SOCIAL ===== */
['social-1','indigo','social',`${hd('السوشيال ميديا')}${kk('social','محتوى كل أسبوع')}<h1>توقّف عن السؤال:<br><span class="mark">واش ننشرو اليوم؟</span></h1>
${V(`${ph('services-1.jpg','right:0;top:20px;width:290px;height:516px;transform:rotate(4deg)')}${ph('mizan-1.jpg','right:330px;top:0;width:290px;height:516px;z-index:2')}${ph('process-2.jpg','left:0;top:20px;width:290px;height:516px;transform:rotate(-4deg)')}${proof('منشورات حقيقية من حساب نواة','right:200px;bottom:-10px;z-index:4')}`)}${foot()}`],
['social-2','paper','social',`${hd('السوشيال ميديا')}${kk('social','تقويم محتوى شهري')}<h1>شهر كامل من المحتوى،<br><span class="hl">جاهز ومجدول.</span></h1>
${V(`<div class="card" style="position:absolute;inset:0 0 20px 0;padding:28px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px;font-size:22px;color:var(--muted);text-align:center;font-weight:500">${['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'].map(d=>`<div>${d}</div>`).join('')}${Array.from({length:28},(_,i)=>{const c=[2,4,7,9,11,14,16,18,21,23,25].includes(i)?(i%3?'var(--indigo)':'var(--lime)'):'';return `<div style="aspect-ratio:1.25;border-radius:14px;border:2px solid var(--line);position:relative;font:600 20px 'Bricolage Grotesque';padding:8px;text-align:start;direction:ltr">${i+1}${c?`<span style="position:absolute;inset:auto 8px 8px 8px;height:30%;border-radius:8px;background:${c}"></span>`:''}</div>`}).join('')}</div></div><div class="chip" style="left:-20px;bottom:-10px"><span class="dot">✓</span><div>توافق من هاتفك قبل النشر<small>والنشر تلقائي في موعده</small></div></div>`)}${foot()}`],
['social-3','ink','social',`${hd('السوشيال ميديا')}${kk('social','Instagram · Facebook · TikTok')}<h1>تصميم واحد متّسق،<br><span class="hl">بمقاس كل منصة.</span></h1>
${V(`${ph('about-1.jpg','left:40px;top:40px;width:270px;height:480px;transform:rotate(-6deg)')}${ph('start-1.jpg','left:365px;top:0;width:290px;height:516px;z-index:2')}${ph('madar-1.jpg','right:40px;top:40px;width:270px;height:480px;transform:rotate(6deg)')}${proof('من تصاميمنا المنشورة','right:330px;bottom:-10px;z-index:4')}`)}${foot()}`],
/* ===== ADS ===== */
['ads-1','ink','ads',`${hd('الإعلانات الممولة')}${kk('ads','Meta · TikTok')}<h1>نوصل منتجك<br><span class="hl">لمن يبحث عنه.</span></h1>
${V(`<div class="card" style="position:absolute;inset:10px 0 20px 0;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;font-size:30px;font-weight:700">ما نتابعه لك كل أسبوع<span style="color:var(--muted);font-weight:500">آخر 7 أيام</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px">${['الوصول','الرسائل','تكلفة الرسالة'].map(a=>`<div style="background:var(--paper);border-radius:20px;padding:20px"><div style="font-size:26px;color:var(--muted)">${a}</div><div style="height:22px;width:70%;border-radius:8px;background:#DDDAF9;margin-top:18px"></div></div>`).join('')}</div><div class="bars" style="margin-top:26px;flex:1">${[30,42,38,55,61,74,92].map((h,i)=>`<div style="height:${h}%;background:${i==6?'var(--lime)':'#E8E6FF'}"></div>`).join('')}</div></div>${ex('left:24px;top:-6px')}`)}${foot()}`],
['ads-2','lime-bg','ads',`${hd('الإعلانات الممولة')}${kk('ads','ميزانيتك تستاهل خطة')}<h1>زر <span class="hl">«Booster»</span><br>يحرق ميزانيتك.</h1>
${V(`<div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:30px"><div><span class="boost">Booster la publication</span></div><ul class="list"><li><span class="n">1</span>جمهور محدّد بدقة</li><li><span class="n">2</span>عدة نسخ تُختبر معًا</li><li><span class="n">3</span>تقرير أسبوعي بتكلفة كل نتيجة</li></ul></div>`)}${foot()}`],
['ads-3','indigo','ads',`${hd('الإعلانات الممولة')}${kk('ads','حساباتك تبقى ملكك')}<h1>ميزانيتك تُدفع<br>للمنصة <span class="mark">مباشرة.</span></h1>
${V(`<div class="ring" style="width:800px;height:800px;right:-200px;top:-100px"></div><div class="chip" style="right:40px;top:30px;font-size:34px"><span class="dot">f</span><div>Meta Ads<small>فيسبوك وإنستغرام</small></div></div><div class="chip" style="left:40px;top:210px;font-size:34px"><span class="dot">♪</span><div>TikTok Ads<small>و Spark Ads</small></div></div><div class="chip" style="right:140px;top:390px;font-size:34px"><span class="dot">↗</span><div>نوجّه الميزانية للأنجح<small>وأنت تملك الحساب والبيانات</small></div></div>`)}${foot()}`],
/* ===== GROWTH ===== */
['growth-1','ink','growth',`${hd('النتائج والتطوير')}${kk('growth','تقرير شهري')}<h1>نقرأ الأرقام،<br><span class="hl">ونقولك واش تعني.</span></h1>
${V(`<div class="bars" style="position:absolute;inset:20px 0 150px 0">${[28,35,33,46,52,60,71,86].map((h,i)=>`<div style="height:${h}%;${i>5?'background:var(--lime)':''}"></div>`).join('')}</div><div class="chip" style="right:0;bottom:10px"><span class="dot">✓</span><div>تقرير بلغة بسيطة<small>و3 توصيات واضحة للشهر القادم</small></div></div>${ex('left:0;top:0')}`)}${foot()}`],
['growth-2','paper','growth',`${hd('النتائج والتطوير')}${kk('growth','دورة لا تتوقف')}<h1>كل شهر،<br><span class="hl">أحسن من اللي قبلو.</span></h1>
${V(`<div style="position:absolute;inset:0;display:grid;place-items:center"><div style="position:relative;width:580px;height:580px"><div style="position:absolute;inset:0;border-radius:50%;border:6px dashed var(--indigo);opacity:.4"></div>${[['نتعلّم','top:-20px;left:50%;transform:translateX(-50%)'],['نعدّل','bottom:40px;right:-40px'],['نطلق','bottom:40px;left:-40px']].map(([t,s])=>`<div class="tile" style="position:absolute;${s};width:220px;height:220px;background:var(--ink);color:#fff;font-size:48px;border-radius:50%">${t}</div>`).join('')}<div style="position:absolute;inset:0;display:grid;place-items:center">${LOGO.replace('<svg','<svg style="width:140px;height:140px"')}</div></div></div>`)}${foot()}`],
