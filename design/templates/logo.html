<!doctype html>
<html><head><meta charset="utf-8"><title>Logo export</title>
<style>
  /* Wraps an SVG from brand/logo so it renders with the locally installed Inter font. ?file=&w=&h=&bg= */
  html, body { margin: 0; overflow: hidden; background: transparent; }
  img { display: block; }
</style></head>
<body><img id="i">
<script>
  const p = new URLSearchParams(location.search);
  const i = document.getElementById('i');
  i.src = '../../brand/logo/' + p.get('file') + '.svg';
  i.width = +p.get('w'); i.height = +p.get('h');
  if (p.get('bg')) document.body.style.background = p.get('bg');
</script>
</body></html>
