<!doctype html>
<html dir="rtl"><head><meta charset="utf-8"><title>Instagram highlight cover</title>
<link rel="stylesheet" href="fonts.local.css">
<link rel="stylesheet" href="brand.css">
<style>
  /* Instagram crops highlight covers to a small circle: keep the icon in the central ~50%. */
  .canvas { width: 1080px; height: 1920px; display: grid; place-items: center; background: var(--ink); }
  .disc { width: 1080px; height: 1080px; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 70% 25%, color-mix(in srgb, var(--ink) 78%, white), var(--ink) 62%); }
  svg { width: 460px; height: 460px; fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .lime { stroke: var(--lime); }
  .dot { fill: var(--lime); stroke: none; }
</style></head>
<body>
<div class="canvas"><div class="disc" id="d"></div></div>
<script>
  const ICONS = {
    // services: a product window with a lime spark
    services: '<rect x="14" y="22" width="72" height="56" rx="10"/><path d="M14 38h72"/><circle class="dot" cx="25" cy="30" r="3"/><path class="lime" d="M50 48v16M42 56h16"/>',
    // work: stacked post cards
    work: '<rect x="26" y="16" width="52" height="60" rx="9"/><path d="M18 30v44a10 10 0 0 0 10 10h40"/><circle class="dot" cx="52" cy="40" r="6"/><path class="lime" d="M36 64l10-10 8 8 6-6 8 8"/>',
    // mizan: balance scale
    mizan: '<path d="M50 16v66M30 82h40M20 30h60"/><path d="M20 30l-10 26h20zM80 30l-10 26h20z"/><path class="lime" d="M10 56a10 6 0 0 0 20 0M70 56a10 6 0 0 0 20 0"/><circle class="dot" cx="50" cy="16" r="5"/>',
    // results: rising bars
    results: '<path d="M16 84h68"/><path d="M28 72V56M44 72V44M60 72V50"/><path class="lime" d="M76 72V26"/><circle class="dot" cx="76" cy="20" r="5"/>',
    // contact: chat bubble
    contact: '<path d="M18 30a12 12 0 0 1 12-12h40a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12H42L26 82V68a12 12 0 0 1-8-12z"/><circle class="dot" cx="38" cy="43" r="4"/><circle class="dot" cx="50" cy="43" r="4"/><circle class="dot" cx="62" cy="43" r="4"/>',
  };
  const k = new URLSearchParams(location.search).get('k') || 'services';
  document.getElementById('d').innerHTML = `<svg viewBox="0 0 100 100">${ICONS[k]}</svg>`;
</script>
</body></html>
