<!doctype html>
<html><head><meta charset="utf-8"><title>Profile photo</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Platforms crop profile photos to a circle: the mark sits inside the central ~60%. */
  .canvas { width: 1080px; height: 1080px; display: grid; place-items: center;
    background: radial-gradient(circle at 70% 25%, var(--indigo-2), var(--indigo) 60%); }
  .canvas.v-dark { background: radial-gradient(circle at 70% 25%, color-mix(in srgb, var(--ink) 80%, white), var(--ink) 65%); }
  [data-mark] { width: 640px; height: 640px; }
  [data-mark] svg { width: 100%; height: 100%; display: block; }
</style></head>
<body>
<div class="canvas" id="c"><div data-mark="bare"></div></div>
<script src="brand.js"></script>
<script>Brand.apply(window.BRAND);</script>
<script>
  const v = new URLSearchParams(location.search).get('variant') || (window.BRAND && window.BRAND.profileBg) || 'primary';
  if (v === 'dark') document.getElementById('c').classList.add('v-dark');
</script>
</body></html>
