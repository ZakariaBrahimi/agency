<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>نواة · Launch grid</title>
<link rel="stylesheet" href="fonts.local.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
  /* One 3240x1440 canvas, cut into three 1080x1440 (3:4) posts: left | middle | right.
     Arabic reads right to left, and Instagram shows the newest post on the left,
     so the right tile is posted first and read first. Keep text 90px+ away from the seams (x=1080, 2160). */
  :root { --ink:#0B1220; --panel:#151D31; --panel-2:#1D2741; --line:#2A3553; --fg:#F4F5F8; --muted:#9AA3B8;
    --indigo:#5B4BFF; --indigo-2:#8A7DFF; --lime:#C6F432; --paper:#F6F5F2; --ok:#3DDC97; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  #canvas { position: relative; width: 3240px; height: 1440px; overflow: hidden; color: var(--fg); direction: rtl;
    font-family: "Thmanyah Sans", "IBM Plex Sans Arabic", sans-serif;
    background:
      radial-gradient(ellipse 900px 700px at 2700px 520px, rgba(91,75,255,.55), transparent 70%),
      radial-gradient(ellipse 1100px 800px at 1620px 1000px, rgba(91,75,255,.32), transparent 70%),
      radial-gradient(ellipse 700px 600px at 420px 380px, rgba(198,244,50,.10), transparent 70%),
      var(--ink); }
  #canvas::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px);
    background-size: 90px 90px; }
  .abs { position: absolute; }
  .num { font-family: "Bricolage Grotesque", "IBM Plex Sans Arabic", sans-serif; direction: ltr; unicode-bidi: isolate; }
  .lime { color: var(--lime); }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 36px; box-shadow: 0 40px 90px rgba(0,0,0,.45); }
  .pill { border-radius: 999px; }
  .node { width: 300px; display: grid; justify-items: center; gap: 16px; text-align: center; }
  .node .dot { width: 104px; height: 104px; border-radius: 50%; background: var(--ink); border: 6px solid var(--lime);
    display: grid; place-items: center; font-size: 46px; font-weight: 800; color: var(--lime); box-shadow: 0 0 0 14px rgba(11,18,32,.9); }
  .node b { font-size: 46px; font-weight: 700; line-height: 1.2; }
  .node span { font-size: 30px; color: var(--muted); }
  .tag { position: absolute; top: 70px; height: 64px; padding: 0 28px; border-radius: 999px; border: 2px solid var(--line);
    background: rgba(21,29,49,.85); display: flex; align-items: center; gap: 14px; font-size: 30px; color: var(--muted); }
  .tag i { width: 16px; height: 16px; border-radius: 50%; background: var(--lime); }
</style></head>
<body>
<div id="canvas">

  <!-- The thread that ties the three posts together: from the core of the logo, through the six steps, to the call to action -->
  <svg class="abs" style="inset:0" width="3240" height="1440" viewBox="0 0 3240 1440">
    <defs>
      <linearGradient id="thread" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0" stop-color="#C6F432" stop-opacity=".35"/><stop offset=".15" stop-color="#C6F432"/><stop offset="1" stop-color="#C6F432"/>
      </linearGradient>
    </defs>
    <path d="M2490 440 C2300 440, 2190 560, 2080 720 S1950 920, 1880 932 C1780 860, 1720 652, 1620 652 C1520 652, 1460 860, 1360 932 C1220 1010, 1080 900, 940 830"
      fill="none" stroke="url(#thread)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26"/>
  </svg>

  <!-- RIGHT · post 1: who we are -->
  <div class="tag" style="right:90px"><i></i>مرحبًا، نحن نواة</div>
  <div class="abs" style="left:2490px;top:230px;width:420px;height:420px;border-radius:110px;background:var(--indigo);display:grid;place-items:center;box-shadow:0 50px 120px rgba(91,75,255,.45)">
    <svg width="300" height="300" viewBox="72 72 368 368"><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>
  </div>
  <div class="abs" style="left:2160px;width:1080px;top:700px;text-align:center;font-size:210px;font-weight:700;line-height:1.1">نواة</div>
  <div class="abs" style="left:2250px;width:900px;top:960px;text-align:center;font-size:76px;font-weight:700;line-height:1.3">نطلق <span class="lime">المنتجات الرقمية.</span></div>
  <div class="abs muted" style="left:2250px;width:900px;top:1080px;text-align:center;font-size:36px">استوديو يطوّر المنتجات ويصنع حضورها</div>

  <!-- MIDDLE · post 2: the journey -->
  <div class="tag" style="right:1170px"><i></i>كيف نعمل</div>
  <div class="abs" style="left:1170px;width:900px;top:180px;text-align:center;font-size:92px;font-weight:700;line-height:1.25">من الفكرة<br>إلى <span class="lime">النمو</span></div>
  <div class="abs node" style="left:1730px;top:880px"><div class="dot num">1</div><b>نطوّر المنتج</b><span>موقع، تطبيق، SaaS</span></div>
  <div class="abs node" style="left:1470px;top:600px"><div class="dot num">2</div><b>الهوية</b><span>شعار، ألوان، حضور</span></div>
  <div class="abs node" style="left:1210px;top:880px"><div class="dot num">3</div><b>السوشل ميديا</b><span>تصاميم ومحتوى</span></div>
  <div class="abs" style="left:1170px;width:900px;top:1230px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap">
    <span class="pill" style="padding:12px 28px;border:2px solid var(--line);background:var(--panel);font-size:32px"><b class="num lime">4</b> الإعلانات</span>
    <span class="pill" style="padding:12px 28px;border:2px solid var(--line);background:var(--panel);font-size:32px"><b class="num lime">5</b> النتائج</span>
    <span class="pill" style="padding:12px 28px;border:2px solid var(--line);background:var(--panel);font-size:32px"><b class="num lime">6</b> التطوير</span>
  </div>

  <!-- LEFT · post 3: the stories we tell, and the call to action -->
  <div class="tag" style="right:2250px"><i></i>ابدأ معنا</div>
  <div class="abs" style="left:90px;width:900px;top:180px;text-align:center;font-size:120px;font-weight:700;line-height:1.2">ونروي<br><span class="lime">القصص.</span></div>
  <!-- a post card and a dashboard card: what we make -->
  <div class="abs card" style="left:150px;top:640px;width:420px;height:520px;padding:24px;transform:rotate(-6deg)">
    <div class="pill" style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><span class="pill" style="width:52px;height:52px;background:linear-gradient(135deg,#FF7A59,#FF4D6D)"></span><span class="pill" style="width:160px;height:20px;background:var(--panel-2)"></span></div>
    <div style="height:300px;border-radius:24px;background:linear-gradient(160deg,var(--indigo),var(--indigo-2));display:grid;place-items:center;font-size:76px;font-weight:700">قصتك</div>
    <div style="display:flex;gap:18px;margin-top:22px;align-items:center">
      <svg width="46" height="46" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.5 5c2 0 3.5 1.2 5.5 3.3C14 6.2 15.5 5 17.5 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z" fill="#FF4D6D"/></svg>
      <span class="pill" style="width:120px;height:20px;background:var(--panel-2)"></span>
    </div>
  </div>
  <div class="abs card" style="left:500px;top:720px;width:440px;height:360px;padding:34px;transform:rotate(4deg)">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:30px;margin-bottom:26px"><b>ميزان</b><span class="num pill" style="font-size:24px;padding:6px 16px;background:#10261F;color:var(--ok)">▲ 32%</span></div>
    <div style="display:flex;align-items:flex-end;gap:16px;height:200px;direction:ltr">
      <div style="flex:1;height:35%;border-radius:12px;background:var(--panel-2)"></div><div style="flex:1;height:50%;border-radius:12px;background:var(--panel-2)"></div>
      <div style="flex:1;height:45%;border-radius:12px;background:#3A2DD6"></div><div style="flex:1;height:70%;border-radius:12px;background:var(--indigo)"></div>
      <div style="flex:1;height:100%;border-radius:12px;background:var(--lime)"></div>
    </div>
  </div>
  <div class="abs pill" style="left:240px;top:1210px;width:600px;height:120px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:52px;font-weight:700">ابدأ مشروعك</div>
  <div class="abs muted" style="left:90px;width:900px;top:1350px;text-align:center;font-size:30px">الرابط في البايو</div>
</div>
</body></html>
