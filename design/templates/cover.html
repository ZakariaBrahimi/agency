<!doctype html>
<html><head><meta charset="utf-8"><title>Nawa cover</title>
<link rel="stylesheet" href="fonts.local.css"><!-- generated by npm run render from fonts/thmanyah/ (not committed) -->
<link rel="stylesheet" href="brand.css">
<style>
  /* The artwork is a fixed 1200x400 "stage" that is scaled into each platform's safe area
     (passed as ?w&h&sx&sy&sw&sh). The background bleeds across the full canvas. */
  .stage { position: absolute; width: 1200px; height: 400px; transform-origin: 0 0; }
  .copy { position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%); width: 640px; }
  [dir="rtl"] .copy h1 { line-height: 1.22; }
  .copy h1 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 76px; line-height: .98;
    letter-spacing: -.035em; margin: 22px 0 18px; white-space: nowrap; }
  .copy p { font-size: 22px; color: rgba(255,255,255,.72); }
  .copy p b { color: #fff; font-weight: 600; }

  .cards { position: absolute; inset-inline-end: 0; top: 0; width: 520px; height: 400px; }
  .card { position: absolute; border-radius: 22px; background: color-mix(in srgb, var(--ink) 88%, white);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }

  /* SaaS dashboard card (product) */
  .dash { inset-inline-start: 0; top: 48px; width: 330px; height: 250px; padding: 22px; }
  .dash .hd { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .dash .hd i { width: 26px; height: 26px; border-radius: 8px; background: var(--indigo); display: block; }
  .dash .hd span:last-child { margin-inline-start: auto; font-size: 12px; color: var(--lime); font-weight: 600;
    background: color-mix(in srgb, var(--lime) 14%, transparent); padding: 4px 9px; border-radius: 999px; }
  .dash .kpi { font-family: var(--font-display); font-size: 40px; font-weight: var(--display-weight); margin-top: 18px; letter-spacing: -.02em; }
  .dash .kpi small { font-size: 14px; color: rgba(255,255,255,.55); font-weight: 500; margin-inline-start: 6px; letter-spacing: 0; }
  .bars { display: flex; align-items: flex-end; gap: 9px; height: 88px; margin-top: 16px; }
  .bars b { flex: 1; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--indigo-2) 50%, transparent); }
  .bars b:last-child { background: var(--lime); }

  /* Social post card (design) */
  .post { inset-inline-end: 0; top: 140px; width: 230px; height: 236px; padding: 14px; transform: rotate(4deg); }
  .post .img { height: 150px; border-radius: 14px;
    background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-2) 55%, var(--lime) 130%);
    display: grid; place-items: center; }
  .post .img svg { width: 64px; height: 64px; }
  .post .meta { display: flex; gap: 12px; margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.7); }
  .post .meta b { color: #fff; }
  .post .line { height: 8px; border-radius: 4px; background: rgba(255,255,255,.14); margin-top: 10px; width: 80%; }

  .chip { position: absolute; inset-inline-end: 196px; top: 16px; padding: 10px 14px; border-radius: 14px;
    background: var(--lime); color: var(--ink); font-weight: 700; font-size: 14px;
    box-shadow: 0 16px 30px -12px color-mix(in srgb, var(--lime) 50%, transparent); transform: rotate(-3deg); }

</style></head>
<body>
<div class="canvas bg-ink grid" id="c">
  <div class="stage" id="s">
    <div class="copy">
      <span class="pill"><span class="dot"></span><span data-t="pill"></span></span>
      <h1 data-brand="tagline">We build <span class="lime">products.</span><br>We design brands.</h1>
      <p><span data-t="homeOf"></span> <b data-t="product"></b> <span data-t="whatsNext"></span> &nbsp;·&nbsp; <b data-brand="domain" dir="ltr"></b></p>
    </div>
    <div class="cards">
      <div class="card dash">
        <div class="hd"><i></i><span data-t="product"></span><span dir="ltr">▲ 32%</span></div>
        <div class="kpi">12,480<small data-t="activeUsers"></small></div>
        <div class="bars"><b style="height:38%"></b><b style="height:52%"></b><b style="height:46%"></b><b style="height:64%"></b><b style="height:58%"></b><b style="height:78%"></b><b style="height:100%"></b></div>
      </div>
      <div class="card post">
        <div class="img" data-mark="bare" data-dot="dark"></div>
        <div class="meta"><span>♥ <b>2.4k</b></span><span>↗ <b>318</b></span></div>
        <div class="line"></div>
      </div>
      <div class="chip" data-t="newCampaign"></div>
    </div>
  </div>
</div>
<script src="brand.js"></script>
<script>Brand.apply(window.BRAND);</script>
<script>
  const p = new URLSearchParams(location.search);
  const W = +p.get('w') || 1500, H = +p.get('h') || 500;
  const sx = +(p.get('sx') ?? 0), sy = +(p.get('sy') ?? 0);
  const sw = +p.get('sw') || W, sh = +p.get('sh') || H;
  const c = document.getElementById('c'), s = document.getElementById('s');
  c.style.width = W + 'px'; c.style.height = H + 'px';
  const k = Math.min(sw / 1200, sh / 400);
  s.style.left = (sx + (sw - 1200 * k) / 2) + 'px';
  s.style.top = (sy + (sh - 400 * k) / 2) + 'px';
  s.style.transform = `scale(${k})`;
  // Shrink the headline until its longest line fits the copy column.
  const h1 = document.querySelector('.copy h1');
  const fit = () => { let f = 76; h1.style.fontSize = f + 'px'; while (h1.scrollWidth > 640 && f > 40) h1.style.fontSize = --f + 'px'; };
  fit();
  document.fonts.ready.then(fit);
</script>
</body></html>
