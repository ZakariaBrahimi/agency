<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نواة | من الفكرة إلى النمو</title>
<meta name="description" content="نواة: نطوّر منتجك، ونصنع له هوية بصرية وحضورًا، ونصمّم محتواه على السوشيال ميديا، ونروّج له بالإعلانات، ثم ندرس النتائج ونطوّر.">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="canonical" href="https://nawa-studio-six.vercel.app/">
<link rel="alternate" hreflang="ar" href="https://nawa-studio-six.vercel.app/">
<link rel="alternate" hreflang="en" href="https://nawa-studio-six.vercel.app/en">
<link rel="alternate" hreflang="fr" href="https://nawa-studio-six.vercel.app/fr">
<link rel="alternate" hreflang="x-default" href="https://nawa-studio-six.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="نواة">
<meta property="og:title" content="نواة | نطلق المنتجات الرقمية. ونروي القصص.">
<meta property="og:description" content="نطوّر منتجك، ونصنع له هوية وحضورًا، ونصمّم محتواه، ونروّج له بالإعلانات، ثم ندرس النتائج ونطوّر.">
<meta property="og:url" content="https://nawa-studio-six.vercel.app/">
<meta property="og:image" content="https://nawa-studio-six.vercel.app/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_AR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/i18n.js" defer></script>
<script src="assets/js/main.js" defer></script>
</head>
<body>


<header class="top">
  <div class="wrap nav">
    <a class="brand" href="#top" aria-label="Nawa">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>
      <span data-i="brand">نواة</span>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#journey" data-i="nav.journey"></a>
      <a href="#s1" data-i="nav.team"></a>
      <a href="#models" data-i="nav.models"></a>
      <a href="#contact" data-i="nav.contact"></a>
    </nav>
    <div class="nav-end">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" lang="ar" data-lang="ar">ع</button>
        <button type="button" lang="en" data-lang="en">EN</button>
        <button type="button" lang="fr" data-lang="fr">FR</button>
      </div>
      <a class="btn btn-lime" href="/start" data-start data-i="nav.cta"></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow"><span class="dot"></span><span data-i="hero.eyebrow"></span></span>
        <h1 data-i-html="hero.title"></h1>
        <p class="sub" data-i="hero.sub"></p>
        <div class="ctas">
          <a class="btn btn-lime" href="/start" data-start><span data-i="hero.cta1"></span><span class="arr" aria-hidden="true">→</span></a>
          <a class="btn btn-ghost" href="#journey" data-i="hero.cta2"></a>
        </div>
      </div>
      <!-- The journey as a cycle around the core (النواة) -->
      <div class="cycle" aria-hidden="true">
        <div class="ring"></div>
        <div class="orbit"><span></span></div>
        <div class="center"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg></div>
        <a class="node n1" href="#s1"><b dir="ltr">1</b><span data-i="c1"></span></a>
        <a class="node n2" href="#s2"><b dir="ltr">2</b><span data-i="c2"></span></a>
        <a class="node n3" href="#s3"><b dir="ltr">3</b><span data-i="c3"></span></a>
        <a class="node n4" href="#s4"><b dir="ltr">4</b><span data-i="c4"></span></a>
        <a class="node n5" href="#s5"><b dir="ltr">5</b><span data-i="c5"></span></a>
        <a class="node n6" href="#s6"><b dir="ltr">6</b><span data-i="c6"></span></a>
      </div>
    </div>
  </section>

  <section class="band intro" id="journey">
    <div class="wrap">
      <span class="kicker"><span class="dot"></span><span data-i="journey.kicker"></span></span>
      <h2 data-i="journey.title"></h2>
      <ol class="jstrip">
        <li><a href="#s1"><b dir="ltr">1</b><span data-i="c1.long"></span></a></li>
        <li><a href="#s2"><b dir="ltr">2</b><span data-i="c2.long"></span></a></li>
        <li><a href="#s3"><b dir="ltr">3</b><span data-i="c3.long"></span></a></li>
        <li><a href="#s4"><b dir="ltr">4</b><span data-i="c4.long"></span></a></li>
        <li><a href="#s5"><b dir="ltr">5</b><span data-i="c5.long"></span></a></li>
        <li><a href="#s6"><b dir="ltr">6</b><span data-i="c6.long"></span></a></li>
      </ol>
    </div>
  </section>

  <!-- Step 1: product (the deepest section) -->
  <section class="band step dark" id="s1">
    <div class="wrap">
      <div class="split">
        <div class="txt">
          <span class="stepno" data-step="1"></span>
          <span class="kicker"><span class="dot"></span><span data-i="s1.kicker"></span></span>
          <h2 data-i="s1.title"></h2>
          <p class="lead" data-i="s1.lead"></p>
        </div>
        <div class="vis-step" aria-hidden="true">
          <div class="mock teamcard static">
            <div class="sprint"><span data-i="mock.sprint"></span><b data-i="mock.app"></b></div>
            <div class="avatars"><span class="av a1" data-i="r1"></span><span class="av a2" data-i="r2"></span><span class="av a3" data-i="r3"></span></div>
            <div class="prog"><i></i></div>
            <div class="tasks"><span class="done" data-i="mock.t1"></span><span class="done" data-i="mock.t2"></span><span data-i="mock.t3"></span></div>
          </div>
        </div>
      </div>
      <div class="roles">
        <article class="role"><span class="badge b1" data-i="r1"></span><h3 data-i="s1.po.t"></h3><p data-i="s1.po.d"></p></article>
        <article class="role"><span class="badge b2" data-i="r2"></span><h3 data-i="s1.ux.t"></h3><p data-i="s1.ux.d"></p></article>
        <article class="role"><span class="badge b3" data-i="r3"></span><h3 data-i="s1.dev.t"></h3><p data-i="s1.dev.d"></p></article>
      </div>
      <h3 class="subhead" data-i="s1.path"></h3>
      <ul class="path">
        <li><b data-i="s1.p1.t"></b><span data-i="s1.p1.d"></span></li>
        <li><b data-i="s1.p2.t"></b><span data-i="s1.p2.d"></span></li>
        <li><b data-i="s1.p3.t"></b><span data-i="s1.p3.d"></span></li>
        <li><b data-i="s1.p4.t"></b><span data-i="s1.p4.d"></span></li>
        <li><b data-i="s1.p5.t"></b><span data-i="s1.p5.d"></span></li>
      </ul>
      <div class="getbox">
        <div>
          <h3 data-i="s1.get.t"></h3>
          <ul class="dots"><li data-i="s1.get.1"></li><li data-i="s1.get.2"></li><li data-i="s1.get.3"></li></ul>
        </div>
        <div class="proof">
          <span class="tag" data-i="s1.proof.tag"></span>
          <b><span data-i="mizan"></span><span class="lime">.</span></b>
          <p data-i="s1.proof.d"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 2: identity & presence -->
  <section class="band step" id="s2">
    <div class="wrap split">
      <div class="txt">
        <span class="stepno" data-step="2"></span>
        <span class="kicker"><span class="dot"></span><span data-i="s2.kicker"></span></span>
        <h2 data-i="s2.title"></h2>
        <p class="lead" data-i="s2.lead"></p>
        <ul class="dots"><li data-i="s2.1"></li><li data-i="s2.2"></li><li data-i="s2.3"></li><li data-i="s2.4"></li></ul>
      </div>
      <div class="vis-step" aria-hidden="true">
        <div class="board">
          <div class="b-logo"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg></div>
          <div class="b-pal"><i style="background:#0B1220"></i><i style="background:#5B4BFF"></i><i style="background:#C6F432"></i><i style="background:#F6F5F2"></i></div>
          <div class="b-type"><span class="ar">أب</span><span class="la">Aa</span></div>
          <div class="b-profile"><span class="pic"><svg viewBox="72 72 368 368" aria-hidden="true"><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg></span><span class="lines"><i></i><i class="s"></i></span><span class="cover"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 3: social media designs -->
  <section class="band step alt" id="s3">
    <div class="wrap split flip">
      <div class="txt">
        <span class="stepno" data-step="3"></span>
        <span class="kicker"><span class="dot"></span><span data-i="s3.kicker"></span></span>
        <h2 data-i="s3.title"></h2>
        <p class="lead" data-i="s3.lead"></p>
        <ul class="dots"><li data-i="s3.1"></li><li data-i="s3.2"></li><li data-i="s3.3"></li><li data-i="s3.4"></li></ul>
      </div>
      <div class="vis-step" aria-hidden="true">
        <div class="vis vis-posts">
          <div class="tile t1"><svg viewBox="72 72 368 368" aria-hidden="true"><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg></div>
          <div class="tile t2"></div>
          <div class="tile t3"></div>
          <div class="tile t4 cal"><span dir="ltr">12</span><em data-i="mock.posts" style="font-style:normal"></em></div>
          <div class="tile t5"></div>
          <div class="tile t6"><svg viewBox="72 72 368 368" aria-hidden="true"><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#C6F432" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#FFFFFF"/></svg></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 4: ads -->
  <section class="band step dark" id="s4">
    <div class="wrap split">
      <div class="txt">
        <span class="stepno" data-step="4"></span>
        <span class="kicker"><span class="dot"></span><span data-i="s4.kicker"></span></span>
        <h2 data-i="s4.title"></h2>
        <p class="lead" data-i="s4.lead"></p>
        <ul class="dots"><li data-i="s4.1"></li><li data-i="s4.2"></li><li data-i="s4.3"></li><li data-i="s4.4"></li></ul>
        <p class="assure"><span class="dot"></span><span data-i="s4.assure"></span></p>
      </div>
      <div class="vis-step" aria-hidden="true">
        <div class="mock adcard static">
          <div class="hd"><span class="plat meta">Meta</span><span class="plat tt">TikTok</span><span class="live"><span class="pulse"></span><span data-i="mock.live"></span></span></div>
          <div class="metrics">
            <div><small data-i="mock.reach"></small><b dir="ltr">86.4k</b></div>
            <div><small data-i="mock.clicks"></small><b dir="ltr">3,120</b></div>
            <div><small data-i="mock.cpc"></small><b dir="ltr">0.21</b></div>
          </div>
          <svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M0 58 C40 54 60 44 90 46 S150 30 180 32 S240 14 300 8 L300 70 L0 70 Z" fill="currentColor" opacity=".18"/><path d="M0 58 C40 54 60 44 90 46 S150 30 180 32 S240 14 300 8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="300" cy="8" r="5" fill="#C6F432"/></svg>
          <span class="note" data-i="mock.example"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 5: results -->
  <section class="band step" id="s5">
    <div class="wrap split flip">
      <div class="txt">
        <span class="stepno" data-step="5"></span>
        <span class="kicker"><span class="dot"></span><span data-i="s5.kicker"></span></span>
        <h2 data-i="s5.title"></h2>
        <p class="lead" data-i="s5.lead"></p>
        <ul class="dots"><li data-i="s5.1"></li><li data-i="s5.2"></li><li data-i="s5.3"></li><li data-i="s5.4"></li></ul>
      </div>
      <div class="vis-step" aria-hidden="true">
        <div class="report">
          <div class="r-hd"><b data-i="mock.report"></b><span class="note" data-i="mock.example"></span></div>
          <div class="r-chart"><i style="height:42%"></i><i style="height:55%"></i><i style="height:50%"></i><i style="height:68%"></i><i style="height:74%"></i><i style="height:92%"></i></div>
          <div class="r-rows">
            <div><span data-i="mock.reach"></span><b dir="ltr">+24%</b></div>
            <div><span data-i="mock.engage"></span><b dir="ltr">+11%</b></div>
            <div><span data-i="mock.conv"></span><b dir="ltr">+8%</b></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Step 6: improve, and the loop starts again -->
  <section class="band step improve" id="s6">
    <div class="wrap split">
      <div class="txt">
        <span class="stepno" data-step="6"></span>
        <span class="kicker"><span class="dot"></span><span data-i="s6.kicker"></span></span>
        <h2 data-i="s6.title"></h2>
        <p class="lead" data-i="s6.lead"></p>
        <ul class="dots"><li data-i="s6.1"></li><li data-i="s6.2"></li><li data-i="s6.3"></li></ul>
      </div>
      <div class="vis-step" aria-hidden="true">
        <div class="loop">
          <span class="lp" data-i="s6.l1"></span><span class="la">→</span>
          <span class="lp" data-i="s6.l2"></span><span class="la">→</span>
          <span class="lp" data-i="s6.l3"></span>
          <a class="back" href="#s1"><span class="la">↺</span><span data-i="s6.back"></span></a>
        </div>
      </div>
    </div>
  </section>

  <section class="band" id="models">
    <div class="wrap">
      <span class="kicker"><span class="dot"></span><span data-i="mod.kicker"></span></span>
      <h2 data-i="mod.title"></h2>
      <div class="models">
        <article><span class="plat dev" data-i="mod.1.k"></span><h3 data-i="mod.1.t"></h3><p data-i="mod.1.d"></p></article>
        <article><span class="plat dev" data-i="mod.2.k"></span><h3 data-i="mod.2.t"></h3><p data-i="mod.2.d"></p></article>
        <article><span class="plat dev" data-i="mod.3.k"></span><h3 data-i="mod.3.t"></h3><p data-i="mod.3.d"></p></article>
        <article class="full"><span class="plat lime" data-i="mod.4.k"></span><h3 data-i="mod.4.t"></h3><p data-i="mod.4.d"></p></article>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <div class="cta-box">
        <div>
          <h2 data-i="cta.title"></h2>
          <p data-i="cta.body"></p>
          <div class="need" role="group" aria-labelledby="needLbl">
            <span id="needLbl" class="needlbl" data-i="cta.need"></span>
            <div class="chips">
              <button type="button" data-need="product" data-i="need.product"></button>
              <button type="button" data-need="identity" data-i="need.identity"></button>
              <button type="button" data-need="growth" data-i="need.growth"></button>
              <button type="button" data-need="full" data-i="need.full"></button>
            </div>
          </div>
        </div>
        <div class="mailcard">
          <span class="mail" id="mail">hello@nawa.studio</span>
          <span class="subj" id="subj"></span>
          <div class="row">
            <a class="btn btn-lime" href="/start" data-start data-i="cta.start"></a>
            <a class="btn btn-ghost" id="mailLink" href="mailto:hello@nawa.studio" data-i="cta.btn"></a>
            <button type="button" class="btn btn-ghost" id="copyMail" data-i="cta.copy"></button>
          </div>
          <span class="copied" id="copied" role="status"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <a class="brand" href="#top" aria-label="Nawa">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>
      <span data-i="brand">نواة</span>
    </a>
    <span class="tl" data-i="foot.tagline"></span>
    <div class="socials" id="socials"></div>
    <div class="legal" data-i="foot.legal"></div>
    <a class="legal" href="/privacy" style="color:inherit">الخصوصية · Privacy</a>
  </div>
</footer>
</body>
</html>
