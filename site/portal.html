<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساحة العميل | نواة</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css?v=20261023b">
<link rel="stylesheet" href="assets/css/admin.css?v=20261024e">
<script>window.NAWA_CT = { api: '/api/portal', mode: 'client' };</script>
<script src="assets/js/admin-ui.js?v=20261023b"></script>
<script type="module" src="assets/js/portal.js?v=20261024b"></script>
<script type="module" src="assets/js/admin-content.js?v=20261024b"></script>
</head>
<body class="admin-page portal-page">

<header class="top">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Nawa">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5B4BFF"/><path d="M146 236 A110 110 0 0 0 366 236" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/><circle cx="256" cy="148" r="40" fill="#C6F432"/></svg>
      <span>نواة</span>
    </a>
    <span class="admin-tag" data-t="tag">مساحة العميل</span>
    <div class="nav-end">
      <div class="pt-lang" role="group" aria-label="Language">
        <button type="button" data-lang="ar" lang="ar">ع</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="fr" lang="fr">FR</button>
      </div>
      <button type="button" class="link-btn" id="ptLogout" data-t="logout" hidden>تسجيل الخروج</button>
    </div>
  </div>
</header>

<main class="wrap admin">
  <div class="booting" id="booting" role="status"><span class="spin"></span><span data-t="loading">جارٍ التحميل…</span></div>

  <!-- Sign in: a code by email, or Google -->
  <section class="login" id="ptLogin" hidden>
    <form class="login-card" id="ptEmailForm" novalidate>
      <h1 data-t="loginTitle">تسجيل الدخول</h1>
      <p data-t="loginLead">أدخل البريد الذي سجّلته لدى نواة، ونرسل لك رمز دخول.</p>
      <label for="ptEmail" data-t="email">البريد الإلكتروني</label>
      <input id="ptEmail" type="email" autocomplete="email" dir="ltr" required>
      <button class="btn btn-lime login-btn" type="submit"><span class="btn-label" data-t="sendCode">أرسل الرمز</span></button>
      <div class="pt-or"><span data-t="or">أو</span></div>
      <a class="btn btn-ghost-dark pt-google" href="/api/portal?action=google" data-nobusy>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-1.9 3.3-4.8 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.3V7.1H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
        <span data-t="google">المتابعة بحساب Google</span>
      </a>
      <p class="login-msg" id="ptEmailMsg" role="alert"></p>
    </form>

    <form class="login-card" id="ptCodeForm" hidden novalidate>
      <h1 data-t="codeTitle">أدخل الرمز</h1>
      <p><span data-t="codeLead">أرسلنا رمزًا من 6 أرقام إلى</span> <b dir="ltr" id="ptSentTo"></b></p>
      <label for="ptCode" data-t="code">الرمز</label>
      <input id="ptCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" class="pt-code" required>
      <button class="btn btn-lime login-btn" type="submit"><span class="btn-label" data-t="signIn">دخول</span></button>
      <div class="pt-codeacts">
        <button type="button" class="link-btn" id="ptResend" data-t="resend">إعادة الإرسال</button>
        <button type="button" class="link-btn" id="ptChange" data-t="changeEmail">تغيير البريد</button>
      </div>
      <p class="login-msg" id="ptCodeMsg" role="alert"></p>
    </form>
    <a class="pt-privacy" href="/privacy" id="ptPrivacy" data-t="privacy">سياسة الخصوصية</a>
  </section>

  <!-- Signed in -->
  <div id="ptApp" hidden>
    <div class="pt-hello">
      <div><h1 id="ptCompany"></h1><p class="muted" id="ptUser"></p></div>
    </div>
    <nav class="sections" aria-label="Sections">
      <button type="button" data-tab="platforms" aria-pressed="true" data-t="tabPlatforms">المنصات</button>
      <button type="button" data-tab="content" aria-pressed="false" data-t="tabContent">المحتوى</button>
      <button type="button" data-tab="storage" aria-pressed="false" data-t="tabStorage">التخزين</button>
    </nav>

    <section id="ptPlatforms"></section>
    <section id="ptStorage" hidden></section>

    <!-- the same content tools Nawa uses (assets/js/admin-content.js) -->
    <section id="content" class="ct" hidden>
      <div class="dash-head">
        <div>
          <h1 data-t="tabContent">المحتوى</h1>
          <p class="muted" id="ctAccount"></p>
        </div>
        <div class="ct-head-actions" id="ctHeadActions" hidden>
          <div class="ct-views" role="group">
            <button type="button" data-view="calendar" aria-pressed="true" data-t="calendar">التقويم</button>
            <button type="button" data-view="list" aria-pressed="false" data-t="list">القائمة</button>
          </div>
          <button type="button" class="btn btn-lime" id="ctNew" data-t="newPost">+ منشور جديد</button>
        </div>
      </div>
      <div id="ctBody"></div>
    </section>
  </div>
</main>

<dialog class="pt-shotview" id="ptShotView">
  <button type="button" aria-label="إغلاق">✕</button>
  <img alt="">
</dialog>

<dialog class="ct-dialog" id="ctDialog" aria-labelledby="ctDlgTitle">
  <form method="dialog" class="ct-dlg" id="ctForm"></form>
</dialog>
<div class="ct-toast" id="ctToast" role="status" aria-live="polite"></div>

</body>
</html>
