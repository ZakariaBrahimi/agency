<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نواة: من الفكرة إلى النمو</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="نواة: نطوّر منتجك، ونصنع له هوية وحضورًا، ونصمّم محتواه، ونروّج له بالإعلانات، ثم ندرس النتائج ونطوّر.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Thmanyah is used when installed or self-hosted next to this page (see site/README.md);
     the files are not committed because the font license forbids redistribution. */
  @font-face { font-family: "Thmanyah Sans"; font-weight: 400; src: local("Thmanyah Sans"), local("ThmanyahSans-Regular"), url("fonts/ThmanyahSans-Regular.otf") format("opentype"); font-display: swap; }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 500; src: local("Thmanyah Sans Medium"), local("ThmanyahSans-Medium"), url("fonts/ThmanyahSans-Medium.otf") format("opentype"); font-display: swap; }
  @font-face { font-family: "Thmanyah Sans"; font-weight: 700; src: local("Thmanyah Sans Bold"), local("ThmanyahSans-Bold"), url("fonts/ThmanyahSans-Bold.otf") format("opentype"); font-display: swap; }

  /* Layout: a dark ink hero with the product and post mockups, then light "paper" sections, one idea each;
     the lime dot (the nun's dot, the "core") marks every key moment. Single deliberate look for the brand. */
  :root {
    --ink: #0B1220;
    --ink-2: #151D2E;
    --indigo: #5B4BFF;
    --indigo-2: #8A7FFF;
    --lime: #C6F432;
    --paper: #F6F5F2;
    --card: #FFFFFF;
    --text: #0B1220;
    --muted: #5A6170;
    --line: #E3E1DB;
    --on-ink: #FFFFFF;
    --on-ink-muted: #A9B0C0;
    --font-ar: "Thmanyah Sans", "IBM Plex Sans Arabic", Tahoma, sans-serif;
    --font-lat: "Inter", "Helvetica Neue", Arial, sans-serif;
    --font: var(--font-ar);
    --radius: 22px;
    --wrap: 1180px;
    color-scheme: light;
  }
  html[lang="en"], html[lang="fr"] { --font: var(--font-lat); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--paper); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  html[lang="en"] body, html[lang="fr"] body { line-height: 1.6; }
  a { color: inherit; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .lime { color: var(--lime); }
  .dot { display: inline-block; width: .42em; height: .42em; border-radius: 50%; background: var(--lime); vertical-align: middle; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; border-radius: 6px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 13px 22px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; font-family: inherit; transition: transform .15s, background .15s, border-color .15s; }
  .btn:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  .btn-lime { background: var(--lime); color: var(--ink); }
  .btn-ghost { border-color: rgba(255,255,255,.28); color: var(--on-ink); }
  .btn-ghost:hover { border-color: var(--on-ink); }
  .btn-dark { background: var(--ink); color: var(--on-ink); }
  .btn .arr { display: inline-block; }
  [dir="rtl"] .btn .arr { transform: scaleX(-1); }

  /* Header */
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.08); color: var(--on-ink); }
  .nav { display: flex; align-items: center; gap: 24px; min-height: 68px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 22px; flex: none; }
  .brand svg { width: 36px; height: 36px; display: block; }
  .links { display: flex; gap: 22px; margin-inline-start: 12px; }
  .links a { text-decoration: none; color: var(--on-ink-muted); font-size: 15px; font-weight: 500; }
  .links a:hover { color: var(--on-ink); }
  .nav-end { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }
  .langs { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  .langs button { border: 0; background: none; color: var(--on-ink-muted); font: 600 13px/1 var(--font-lat); padding: 8px 11px; border-radius: 999px; cursor: pointer; }
  .langs button[lang="ar"] { font-family: var(--font-ar); font-size: 14px; }
  .langs button[aria-pressed="true"] { background: var(--on-ink); color: var(--ink); }
  .nav .btn { padding: 10px 18px; font-size: 15px; }
  @media (max-width: 920px) { .links { display: none; } }
  @media (max-width: 520px) { .nav .btn { display: none; } .brand span { font-size: 20px; } }

  /* Hero */
  .hero { background:
      radial-gradient(ellipse 55% 75% at var(--glow-x, 25%) 35%, color-mix(in srgb, var(--indigo) 55%, transparent), transparent 70%),
      radial-gradient(ellipse 35% 50% at var(--glow-x2, 90%) 110%, color-mix(in srgb, var(--lime) 12%, transparent), transparent 70%),
      var(--ink);
    color: var(--on-ink); position: relative; overflow: hidden; }
  [dir="ltr"] .hero { --glow-x: 75%; --glow-x2: 10%; }
  .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px; mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 30%, transparent 80%); }
  .hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 48px; align-items: center; padding-block: 88px 104px; }
  @media (max-width: 920px) { .hero-grid { grid-template-columns: minmax(0, 1fr); padding-block: 56px 72px; gap: 56px; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--on-ink-muted); padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
  .hero h1 { font-weight: 700; font-size: clamp(38px, 4.8vw, 68px); line-height: 1.18; margin-block: 24px 22px; }
  html[lang="en"] .hero h1, html[lang="fr"] .hero h1 { font-weight: 800; letter-spacing: -.035em; line-height: 1.02; font-size: clamp(40px, 6vw, 78px); }
  .hero .sub { font-size: clamp(17px, 1.6vw, 20px); color: var(--on-ink-muted); max-width: 34em; }
  .hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; }

  /* Hero mockups */
  .stage { position: relative; height: 430px; max-width: 520px; width: 100%; justify-self: center; }
  @media (max-width: 520px) { .stage { height: 360px; } }
  .mock { position: absolute; border-radius: var(--radius); background: color-mix(in srgb, var(--ink) 86%, white); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 80px -30px rgba(0,0,0,.7); }
  .dash { inset-inline-start: 0; top: 40px; width: min(340px, 78%); padding: 22px; }
  .dash .hd { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .dash .hd i { width: 26px; height: 26px; border-radius: 8px; background: var(--indigo); flex: none; }
  .dash .hd .up { margin-inline-start: auto; font: 600 12px/1 var(--font-lat); color: var(--lime); background: color-mix(in srgb, var(--lime) 14%, transparent); padding: 6px 9px; border-radius: 999px; }
  .dash .lbl { color: var(--on-ink-muted); font-size: 13px; margin-top: 16px; }
  .dash .kpi { font: 800 38px/1.1 var(--font-lat); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin-top: 16px; }
  .bars b { flex: 1; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--indigo-2) 55%, transparent); }
  .bars b:last-child { background: var(--lime); }
  .post { inset-inline-end: 0; top: 170px; width: min(250px, 58%); padding: 14px; transform: rotate(var(--tilt, -4deg)); }
  [dir="ltr"] .post { --tilt: 4deg; }
  .post .img { aspect-ratio: 1.15; border-radius: 14px; background: linear-gradient(225deg, var(--indigo) 0%, var(--indigo-2) 55%, var(--lime) 135%); display: grid; place-items: center; }
  .post .img svg { width: 34%; height: auto; }
  .post .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--on-ink-muted); }
  .post .meta b { color: var(--on-ink); font: 600 13px var(--font-lat); }
  .chip { position: absolute; inset-inline-end: 34%; top: 6px; padding: 9px 14px; border-radius: 14px; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 14px; transform: rotate(var(--chip-tilt, 3deg)); box-shadow: 0 18px 34px -14px color-mix(in srgb, var(--lime) 60%, transparent); }
  [dir="ltr"] .chip { --chip-tilt: -3deg; }
  .core { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--lime); inset-inline-start: 6%; bottom: 34px; box-shadow: 0 0 0 10px color-mix(in srgb, var(--lime) 14%, transparent); }
  @media (prefers-reduced-motion: no-preference) {
    .core { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--lime) 6%, transparent); } }
  }

  /* Sections */
  section.band { padding-block: 104px; }
  @media (max-width: 720px) { section.band { padding-block: 72px; } }
  .kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--indigo); }
  html[lang="en"] .kicker, html[lang="fr"] .kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; }
  .kicker .dot { width: 9px; height: 9px; }
  .band h2 { font-weight: 700; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.3; margin-top: 14px; max-width: 18em; }
  html[lang="en"] .band h2, html[lang="fr"] .band h2 { font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
  .lead { color: var(--muted); font-size: 18px; max-width: 36em; margin-top: 14px; }

  /* Pillars */
  .pillars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 48px; }
  @media (max-width: 820px) { .pillars { grid-template-columns: minmax(0, 1fr); } }
  .pillar { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 32px; display: grid; gap: 18px; align-content: start; min-width: 0; }
  .pillar h3 { font-size: 28px; font-weight: 700; line-height: 1.35; }
  html[lang="en"] .pillar h3, html[lang="fr"] .pillar h3 { letter-spacing: -.02em; line-height: 1.2; }
  .pillar p { color: var(--muted); }
  .pillar ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .pillar li { display: flex; gap: 12px; align-items: baseline; font-weight: 500; }
  .pillar li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); transform: translateY(-2px); }
  .vis { border-radius: 18px; background: var(--ink); padding: 18px; display: grid; gap: 12px; min-height: 168px; }
  .vis-dash { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; }
  .vis-dash .k { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; color: var(--on-ink); }
  .vis-dash .k small { display: block; color: var(--on-ink-muted); font-size: 12px; }
  .vis-dash .k b { font: 800 22px/1.2 var(--font-lat); font-variant-numeric: tabular-nums; }
  .vis-dash .bars { grid-column: 1 / -1; height: 70px; margin: 0; }
  .vis-posts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; }
  .tile svg { width: 38%; }
  .t1 { background: var(--indigo); } .t2 { background: var(--lime); } .t3 { background: linear-gradient(225deg, var(--indigo), var(--indigo-2)); }
  .t4 { background: #222B40; } .t5 { background: linear-gradient(225deg, var(--indigo-2), var(--lime)); } .t6 { background: var(--indigo); }
  .tile.cal { color: var(--on-ink); font: 700 13px var(--font-lat); display: grid; place-content: center; text-align: center; line-height: 1.2; }
  .tile.cal span { font-size: 26px; font-weight: 800; }

  /* Products */
  .products { background: var(--ink); color: var(--on-ink); }
  .products .kicker { color: var(--lime); }
  .products .lead { color: var(--on-ink-muted); }
  .prod-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; margin-top: 48px; }
  @media (max-width: 860px) { .prod-grid { grid-template-columns: minmax(0, 1fr); } }
  .prod { border-radius: 28px; padding: 34px; display: grid; gap: 16px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
  .prod.mizan { background: linear-gradient(160deg, color-mix(in srgb, var(--indigo) 80%, var(--ink)), var(--ink-2) 75%); border: 1px solid rgba(255,255,255,.12); }
  .prod.next { border: 1.5px dashed rgba(255,255,255,.22); }
  .tag { justify-self: start; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--lime); color: var(--ink); }
  .prod.next .tag { background: rgba(255,255,255,.1); color: var(--on-ink); }
  .prod h3 { font-size: clamp(40px, 5vw, 64px); font-weight: 700; line-height: 1.2; }
  html[lang="en"] .prod h3, html[lang="fr"] .prod h3 { font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
  .prod.next h3 { font-size: 30px; }
  .prod p { color: var(--on-ink-muted); max-width: 30em; font-size: 18px; }
  .prod .btn { justify-self: start; margin-top: 8px; }
  .builtby { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--on-ink-muted); }
  .builtby svg { width: 22px; height: 22px; }

  /* Services */
  .svc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 48px; border-top: 1px solid var(--line); }
  @media (max-width: 900px) { .svc { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .svc { grid-template-columns: minmax(0, 1fr); } }
  .svc article { padding: 28px 0 32px; padding-inline-end: 28px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; align-content: start; min-width: 0; }
  .svc h3 { font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .svc h3::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lime) 30%, transparent); flex: none; }
  .svc p { color: var(--muted); }

  /* Process (a real sequence, so it is numbered) */
  .steps { list-style: none; padding: 0; margin: 48px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; counter-reset: step; }
  @media (max-width: 900px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .steps { grid-template-columns: minmax(0, 1fr); } }
  .steps li { counter-increment: step; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; display: grid; gap: 8px; align-content: start; min-width: 0; }
  .steps li::before { content: counter(step); font: 800 15px/1 var(--font-lat); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--lime); }
  .steps h3 { font-size: 22px; font-weight: 700; }
  .steps p { color: var(--muted); font-size: 16px; }

  /* Contact */
  .contact { padding-block: 0 104px; }
  .cta-box { background: var(--indigo); color: var(--on-ink); border-radius: 32px; padding: clamp(32px, 5vw, 64px); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: center; position: relative; overflow: hidden; }
  @media (max-width: 820px) { .cta-box { grid-template-columns: minmax(0, 1fr); } }
  .cta-box::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; background: var(--lime); opacity: .9; inset-inline-end: -70px; top: -70px; }
  .cta-box h2 { font-size: clamp(28px, 3.4vw, 44px); font-weight: 700; line-height: 1.3; position: relative; z-index: 1; }
  html[lang="en"] .cta-box h2, html[lang="fr"] .cta-box h2 { font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
  .cta-box p { color: color-mix(in srgb, var(--on-ink) 82%, transparent); margin-top: 12px; font-size: 18px; }
  .mailcard { position: relative; z-index: 1; background: var(--ink); border-radius: 22px; padding: 22px; display: grid; gap: 14px; }
  .mail { font: 700 clamp(18px, 2.2vw, 24px)/1.3 var(--font-lat); direction: ltr; text-align: start; user-select: all; overflow-wrap: anywhere; color: var(--on-ink); }
  [dir="rtl"] .mail { text-align: right; }
  .mailcard .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .mailcard .btn-ghost { font-size: 15px; padding: 11px 16px; }
  .copied { font-size: 14px; color: var(--lime); min-height: 1.4em; }

  /* Footer */
  footer { background: var(--ink); color: var(--on-ink-muted); padding-block: 40px; font-size: 15px; }
  .foot { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .foot .brand { color: var(--on-ink); }
  .foot .tl { color: var(--on-ink-muted); }
  .socials { display: flex; gap: 16px; margin-inline-start: auto; flex-wrap: wrap; }
  .socials a { text-decoration: none; font: 500 14px var(--font-lat); }
  .socials a:hover { color: var(--on-ink); }
  .legal { width: 100%; font-size: 13px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 18px; margin-top: 6px; }

  /* ---------- Variant B: the six-step journey ---------- */
  .plat { display: inline-flex; align-items: center; font: 700 12px/1 var(--font-lat); padding: 6px 10px; border-radius: 999px; color: #fff; background: #0866FF; white-space: nowrap; }
  .plat.tt { background: #111; box-shadow: inset 0 0 0 1.5px #25F4EE, 2px 0 0 #FE2C55; }
  .plat.dev { background: var(--indigo); font: 700 13px/1 var(--font); }
  .plat.lime { background: var(--lime); color: var(--ink); font: 700 13px/1 var(--font); }

  /* Hero cycle */
  .cycle { position: relative; width: min(440px, 100%); aspect-ratio: 1; justify-self: center; }
  .ring { position: absolute; inset: 9%; border-radius: 50%; border: 2px dashed rgba(255,255,255,.18); }
  .orbit { position: absolute; inset: 9%; border-radius: 50%; }
  .orbit span { position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 6px color-mix(in srgb, var(--lime) 18%, transparent); }
  @media (prefers-reduced-motion: no-preference) { .orbit { animation: spin 18s linear infinite; } [dir="rtl"] .orbit { animation-direction: reverse; } @keyframes spin { to { transform: rotate(360deg); } } }
  .center { position: absolute; inset: 34%; display: grid; place-items: center; }
  .center svg { width: 100%; height: 100%; filter: drop-shadow(0 20px 40px rgba(91,75,255,.45)); }
  .node { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); width: 112px; display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--on-ink); }
  .node b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--font-lat); background: var(--ink-2); border: 1.5px solid rgba(255,255,255,.25); }
  .node span { font-size: 14px; font-weight: 700; background: color-mix(in srgb, var(--ink) 70%, transparent); padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .node:hover b, .node.n1 b { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  /* Six stops on the ring (radius 41%), clockwise from the top; mirrored for Arabic. */
  .n1 { --x: 50%; --y: 9%; } .n2 { --x: 85.5%; --y: 29.5%; } .n3 { --x: 85.5%; --y: 70.5%; }
  .n4 { --x: 50%; --y: 91%; } .n5 { --x: 14.5%; --y: 70.5%; } .n6 { --x: 14.5%; --y: 29.5%; }
  [dir="rtl"] .n2, [dir="rtl"] .n3 { --x: 14.5%; } [dir="rtl"] .n5, [dir="rtl"] .n6 { --x: 85.5%; }
  @media (max-width: 520px) { .node { width: 92px; } .node span { font-size: 12.5px; } }

  /* Journey strip */
  .intro { padding-bottom: 40px; }
  .jstrip { list-style: none; padding: 0; margin: 36px 0 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 960px) { .jstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  const LANGS = ['ar', 'en', 'fr'];
  const html = document.documentElement;
  const $ = (id) => document.getElementById(id);
  let lang = 'ar';
  let need = null;

  function subject() {
    const t = T[lang];
    return need ? `${t['subj.base']} · ${t['need.' + need]}` : t['subj.base'];
  }
  function renderContact() {
    const t = T[lang];
    $('subj').textContent = t['cta.subj'] + subject();
    $('mailLink').href = `mailto:${SITE.email}?subject=${encodeURIComponent(subject())}`;
    document.querySelectorAll('[data-need]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.need === need)));
  }

  function setLang(next, save) {
    lang = LANGS.includes(next) ? next : 'ar';
    const t = T[lang];
    html.lang = lang;
    html.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t['meta.title'];
    document.querySelectorAll('[data-i]').forEach((el) => { if (t[el.dataset.i] != null) el.textContent = t[el.dataset.i]; });
    document.querySelectorAll('[data-i-html]').forEach((el) => { if (t[el.dataset.iHtml] != null) el.innerHTML = t[el.dataset.iHtml]; });
    document.querySelectorAll('[data-step]').forEach((el) => { el.innerHTML = `<b dir="ltr">${el.dataset.step}</b>${t['step.of']}`; });
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('copied').textContent = '';
    renderContact();
    if (save) {
      try { localStorage.setItem('nawa.lang', lang); } catch (e) {}
      try { history.replaceState(null, '', lang === 'ar' ? location.pathname + location.search : '#' + lang); } catch (e) {}
    }
  }

  // Arabic first. A #en / #fr link or a saved choice switches the language.
  let start = 'ar';
  try { start = localStorage.getItem('nawa.lang') || start; } catch (e) {}
  const h = location.hash.slice(1);
  if (LANGS.includes(h)) start = h;
  setLang(start, false);
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
  document.querySelectorAll('[data-need]').forEach((b) => b.addEventListener('click', () => { need = need === b.dataset.need ? null : b.dataset.need; renderContact(); }));

  $('mail').textContent = SITE.email;
  SITE.socials.forEach(([name, url]) => { const a = document.createElement('a'); a.href = url; a.textContent = name; a.rel = 'noopener'; $('socials').appendChild(a); });

  $('copyMail').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(SITE.email); $('copied').textContent = T[lang]['cta.copied']; }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($('mail'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      $('copied').textContent = T[lang]['cta.copyFail'];
    }
  });
})();
